<!DOCTYPE html>
<!-- ZeDUI/workshop/controller_map/controller_pad.html (Oct 23 2026)
     The pad for the Workshop's controller map card: a generic controller in the
     System 7 balloon look (paper, ink outline, stepped shadow) on the gallery's
     dark body colour. Drawn at 1920 x 1080, rendered at 2x (3840 x 2160) as the
     card's source; make_shots adds the title bar, the balloons and the caption
     (shots.json, id controller_map). Generic on purpose: no maker's shape or logo.
     Render: node render_pad.js  ->  controller_pad.png -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family:FiraMonoB; src:url(FiraMono-Bold.ttf); }
@font-face { font-family:Chicago; src:url(ChicagoFLF.ttf); }
html, body { margin:0; background:transparent; }
svg { display:block; }
</style></head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- the body: one rounded bar and two grips, drawn as a union (outline first, fill over it) -->
  <g id="bodyShapes">
    <rect x="650" y="330" width="620" height="270" rx="100"/>
    <rect x="640" y="420" width="200" height="330" rx="100" transform="rotate(18 740 585)"/>
    <rect x="1080" y="420" width="200" height="330" rx="100" transform="rotate(-18 1180 585)"/>
  </g>
  <g id="dpadShapes">
    <rect x="743" y="382" width="34" height="96" rx="4"/>
    <rect x="712" y="413" width="96" height="34" rx="4"/>
  </g>
</defs>

<!-- stepped shadow -->
<g fill="#0A0A0A" transform="translate(7 7)">
  <rect x="690" y="262" width="130" height="64" rx="18"/><rect x="1100" y="262" width="130" height="64" rx="18"/>
  <rect x="672" y="300" width="176" height="42" rx="14"/><rect x="1072" y="300" width="176" height="42" rx="14"/>
  <use href="#bodyShapes"/>
</g>

<!-- triggers and bumpers -->
<g fill="#F2F2F2" stroke="#0A0A0A" stroke-width="3">
  <rect x="690" y="262" width="130" height="64" rx="18"/><rect x="1100" y="262" width="130" height="64" rx="18"/>
  <rect x="672" y="300" width="176" height="42" rx="14"/><rect x="1072" y="300" width="176" height="42" rx="14"/>
</g>
<g font-family="FiraMonoB" font-size="16" fill="#0A0A0A" text-anchor="middle">
  <text x="755" y="288">LT</text><text x="1165" y="288">RT</text>
  <text x="760" y="327">LB</text><text x="1160" y="327">RB</text>
</g>

<!-- body: a 6 px outline of the union, then the fill over it leaves 3 px -->
<g fill="#0A0A0A" stroke="#0A0A0A" stroke-width="6"><use href="#bodyShapes"/></g>
<g fill="#F2F2F2"><use href="#bodyShapes"/></g>

<!-- the ZeD mark, centre top -->
<text x="960" y="360" font-family="Chicago" font-size="22" fill="#D4922A" text-anchor="middle">ZeD</text>

<!-- D-pad -->
<g fill="#0A0A0A" stroke="#0A0A0A" stroke-width="6"><use href="#dpadShapes"/></g>
<g fill="#F2F2F2"><use href="#dpadShapes"/></g>
<g fill="#0A0A0A">
  <path d="M760 390 l-8 10 h16 z"/><path d="M760 470 l-8 -10 h16 z"/>
  <path d="M720 430 l10 -8 v16 z"/><path d="M800 430 l-10 -8 v16 z"/>
</g>

<!-- View and Menu -->
<g fill="#F2F2F2" stroke="#0A0A0A" stroke-width="3">
  <rect x="886" y="391" width="38" height="20" rx="10"/><rect x="996" y="391" width="38" height="20" rx="10"/>
</g>
<g fill="none" stroke="#0A0A0A" stroke-width="2">
  <rect x="898" y="396" width="9" height="7"/><rect x="903" y="399" width="9" height="7"/>
  <path d="M1007 397 h16 M1007 401 h16 M1007 405 h16"/>
</g>

<!-- face buttons -->
<g fill="#F2F2F2" stroke="#0A0A0A" stroke-width="3">
  <circle cx="1160" cy="388" r="20"/><circle cx="1160" cy="472" r="20"/>
  <circle cx="1118" cy="430" r="20"/><circle cx="1202" cy="430" r="20"/>
</g>
<g font-family="FiraMonoB" font-size="20" fill="#0A0A0A" text-anchor="middle" dominant-baseline="central">
  <text x="1160" y="389">Y</text><text x="1160" y="473">A</text><text x="1118" y="431">X</text><text x="1202" y="431">B</text>
</g>

<!-- sticks -->
<g stroke="#0A0A0A" stroke-width="3">
  <circle cx="865" cy="540" r="46" fill="#D8D8D8"/><circle cx="865" cy="540" r="30" fill="#F2F2F2"/>
  <circle cx="1055" cy="540" r="46" fill="#D8D8D8"/><circle cx="1055" cy="540" r="30" fill="#F2F2F2"/>
</g>
<g fill="none" stroke="#0A0A0A" stroke-width="1.5" opacity=".5">
  <circle cx="865" cy="540" r="20"/><circle cx="1055" cy="540" r="20"/>
</g>
</svg>
</body></html>
