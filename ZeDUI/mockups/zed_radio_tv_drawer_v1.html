<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeD-UI World Window — Lua Render Preview</title>
    <style>
        /* ====================================================================
           LUA-FLAT RENDERING MODE
           Only what PZ's drawRect + drawRectBorder + drawText can produce:
           - Solid colors (no gradients, no transparency tricks)
           - 1px borders (top/right/bottom/left can each be a different color)
           - Square corners (no border-radius)
           - No box-shadow, no text-shadow, no glow, no blur
           - Textures only via small tileable sprites (woodgrain shown as approx)
           ==================================================================== */

        * { margin: 0; padding: 0; box-sizing: border-box; }

        @import url('https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Condensed:wght@400;500;700&display=swap');

        body {
            font-family: 'Fira Sans Condensed', sans-serif;
            background: #0a0a0a;
            color: #000;
            padding: 20px;
            min-height: 100vh;
        }

        .label-banner {
            background: #ffaa00;
            color: #000;
            padding: 6px 12px;
            font-family: 'Fira Mono', monospace;
            font-size:9px;
            font-weight: bold;
            margin-bottom: 12px;
            border: 1px solid #000;
            display: inline-block;
            letter-spacing: 1px;
        }

        /* ===== WORLD WINDOW (System 7 chrome — already Lua-friendly) ===== */
        .world-window {
            width: 960px;
            background: #c0c0c0;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            display: flex;
            flex-direction: column;
        }

        /* Title bar — striped pattern faked via repeating-linear-gradient.
           In Lua this is a 1x2 px texture tiled across. */
        .title-bar {
            background-color: #c0c0c0;
            background-image: repeating-linear-gradient(to bottom, #000 0 1px, #c0c0c0 1px 2px);
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #000;
            padding: 0 4px;
        }

        .close-box, .zoom-box {
            width: 11px; height: 11px;
            background: #c0c0c0;
            border: 1px solid #000;
            cursor: pointer;
            position: relative; z-index: 2;
        }

        .zoom-box::before {
            content: '';
            position: absolute;
            top: 1px; left: 1px; right: 3px; bottom: 3px;
            border: 1px solid #000;
        }

        .title-text {
            background: #c0c0c0;
            padding: 0 8px;
            font-size:11px;
            font-weight: bold;
            position: relative; z-index: 2;
            letter-spacing: 0.5px;
        }

        .sub-header {
            background: #c0c0c0;
            padding: 3px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #808080;
        }

        .sub-title { font-weight: bold; font-size:11px; }
        .item-count { font-family: 'Fira Mono', monospace; font-size:9px; color: #444; }

        .action-strip {
            background: #c0c0c0;
            padding: 3px 4px;
            display: flex;
            gap: 3px;
            border-bottom: 1px solid #000;
            align-items: center;
        }

        /* System 7 outset button — pure 1px borders, fully Lua-renderable */
        .btn-outset {
            background: #c0c0c0;
            border-top: 1px solid #ffffff;
            border-left: 1px solid #ffffff;
            border-right: 1px solid #000000;
            border-bottom: 1px solid #000000;
            cursor: pointer;
        }

        .btn-outset:active {
            border-top: 1px solid #000000;
            border-left: 1px solid #000000;
            border-right: 1px solid #ffffff;
            border-bottom: 1px solid #ffffff;
        }

        .action-btn {
            width: 18px; height: 16px;
            background: #c0c0c0;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size:9px;
            font-weight: bold;
        }

        .action-spacer { flex: 1; }
        .browse-info { padding: 0 6px; font-size:9px; font-weight: bold; font-family: 'Fira Mono', monospace; }
        .location-tag { background: #ffffaa; padding: 1px 6px; border: 1px solid #000; font-size:9px; font-weight: bold; }

        .body-row { display: flex; }

        /* Inventory panel — left side of body row, mirrors in-game LootWindow style */
        .inv-panel {
            width: 444px;
            background: #c0c0c0;
            border-right: 1px solid #808080;
            display: flex;
            flex-direction: column;
            min-height: 440px;
        }

        .inv-sub-header {
            background: #c0c0c0;
            padding: 3px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #808080;
        }

        .inv-title-group { display: flex; align-items: center; gap: 6px; }
        .inv-icon-mark {
            width: 14px; height: 14px;
            background: #888;
            border: 1px solid #000;
            display: inline-block;
        }
        .inv-title { font-weight: bold; font-size: 11px; }
        .inv-items-count { font-family: 'Fira Mono', monospace; font-size: 9px; color: #444; }

        .inv-col-headers {
            background: #c0c0c0;
            padding: 2px 8px;
            display: grid;
            grid-template-columns: 32px 1fr 60px 60px 28px;
            gap: 4px;
            font-size: 8px;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #808080;
            font-family: 'Fira Mono', monospace;
        }

        .inv-col-headers .col-name { text-decoration: underline; color: #000; }

        .inv-list {
            flex: 1;
            background: #c0c0c0;
            padding: 0;
            overflow-y: auto;
        }

        .inv-cat-row {
            padding: 2px 8px;
            font-size: 9px;
            color: #555;
            font-family: 'Fira Sans Condensed', sans-serif;
            display: flex;
            align-items: center;
            gap: 4px;
            background: #c0c0c0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .inv-cat-disclosure { font-size: 8px; }

        .inv-item-row {
            display: grid;
            grid-template-columns: 32px 1fr 60px 60px 28px;
            gap: 4px;
            padding: 2px 8px;
            align-items: center;
            font-size: 11px;
            cursor: pointer;
            font-family: 'Fira Sans Condensed', sans-serif;
        }
        .inv-item-row:hover { background: #b0b0b0; }
        .inv-item-row.selected {
            background: #4a6a8a;
            color: #fff;
        }
        .inv-item-row.selected .col-cat,
        .inv-item-row.selected .col-wt { color: #d0e0f0; }

        .inv-item-cell {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .inv-item-icon {
            width: 14px; height: 14px;
            background: #707070;
            border: 1px solid #303030;
            flex-shrink: 0;
        }

        .inv-item-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .col-dist {
            font-family: 'Fira Mono', monospace;
            font-size: 9px;
            color: #444;
            text-align: right;
        }
        .inv-item-row.selected .col-dist { color: #d0e0f0; }

        .col-cat {
            font-size: 9px;
            color: #555;
            font-family: 'Fira Mono', monospace;
        }

        .col-cond {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .cond-bar {
            width: 100%;
            height: 3px;
            background: #303030;
            border: 1px solid #1a1a1a;
            position: relative;
        }
        .cond-bar-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            background: #2a8a2a;
        }

        .col-wt {
            font-family: 'Fira Mono', monospace;
            font-size: 9px;
            color: #444;
            text-align: right;
        }

        .drawer-content {
            width: 480px;
            min-height: 440px;
        }

        .tab-strip {
            width: 28px;
            background: #c0c0c0;
            border-left: 1px solid #000;
            display: flex;
            flex-direction: column;
            padding: 4px 0;
            gap: 2px;
        }

        .tab-icon {
            width: 24px; height: 24px;
            margin: 0 2px;
            background: #c0c0c0;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size:9px;
            font-weight: bold;
            font-family: 'Fira Sans Condensed', sans-serif;
            position: relative;
            color: #000;
        }

        .tab-icon.active {
            background: #c0c0c0;
            border-top: 1px solid #000;
            border-left: 1px solid #000;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
        }

        .tab-icon.active::after {
            content: '';
            position: absolute;
            right: -5px; top: 50%;
            transform: translateY(-50%);
            width: 4px; height: 24px;
            background: #ff6600;
        }

        .tab-count-badge {
            position: absolute;
            top: -4px; right: -4px;
            background: #cc0000;
            color: #fff;
            font-size:8px;
            font-weight: bold;
            padding: 1px 3px;
            border: 1px solid #000;
            font-family: 'Fira Mono', monospace;
            min-width: 12px;
            text-align: center;
            line-height: 1;
        }

        .tab-icon.disabled { opacity: 0.4; }

        .tab-divider {
            height: 1px;
            background: #808080;
            margin: 2px 4px;
        }

        .util-strip {
            background: #c0c0c0;
            padding: 2px 4px;
            display: flex;
            gap: 2px;
            border-top: 1px solid #000;
            min-height: 22px;
            align-items: center;
        }

        .util-btn {
            height: 16px;
            padding: 0 5px;
            background: #c0c0c0;
            border-top: 1px solid #fff;
            border-left: 1px solid #fff;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            font-size:9px;
            font-weight: bold;
        }

        .util-spacer { flex: 1; }
        .util-status { font-size:8px; font-family: 'Fira Mono', monospace; color: #444; }

        /* ===========================================
           PREMIUM TECHNOLOGIES — flat silver chassis
           In Lua: solid #b8b8b8 fill + 1px highlight
           =========================================== */
        .pt-housing {
            background: #b8b8b8;
            padding: 8px;
            position: relative;
            margin: 0;
            min-height: 440px;
        }

/* VFD display — solid dark blue background, solid cyan text */
        .pt-vfd {
            background: #050a14;
            border-top: 1px solid #2a2a2a;
            border-left: 1px solid #2a2a2a;
            border-right: 1px solid #1a1a1a;
            border-bottom: 1px solid #1a1a1a;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-family: 'Fira Mono', monospace;
        }

        .pt-vfd-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 6px;
        }

        .pt-vfd-freq {
            font-size:24px;
            color: #66ddff;
            letter-spacing: 2px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
            font-family: 'Fira Mono', monospace;
        }

        .pt-vfd-unit {
            font-size:11px;
            color: #4499bb;
            letter-spacing: 1px;
            margin-top: 6px;
            font-weight: bold;
        }

        .pt-vfd-indicators {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-size:9px;
            color: #2a3a4a;
            text-align: right;
            font-family: 'Fira Mono', monospace;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .pt-vfd-indicators .on {
            color: #66ddff;
        }

        .pt-vfd-indicators .red {
            color: #66ddff;
        }

        .pt-vfd-channel {
            font-size:13px;
            color: #4499bb;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-transform: uppercase;
            border-top: 1px solid #1a3a4a;
            padding-top: 4px;
        }

        .pt-vfd-bottom {
            display: flex;
            justify-content: space-between;
            font-size:9px;
            color: #66ddff;
            font-family: 'Fira Mono', monospace;
            border-top: 1px solid #1a3a4a;
            padding-top: 4px;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .pt-vfd-bottom .label {
            color: #4499bb;
            margin-right: 2px;
        }

        /* Signal wave readout — oscilloscope-style waveform, ~3 lines tall */
        .signal-wave {
            position: relative;
            height: 36px;
            margin-bottom: 4px;
            background: transparent;
            overflow: hidden;
        }

        .wave-center-line {
            position: absolute;
            left: 0; right: 0;
            top: 50%;
            height: 1px;
            background: #1a3a4a;
        }

        .wave-bar {
            position: absolute;
            background: #66ddff;
        }

        .wave-axis-label {
            position: absolute;
            font-family: 'Fira Mono', monospace;
            font-size: 8px;
            color: #4499bb;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* Slide-rule tuning dial */
        .pt-tuning-dial {
            background: #1a1a1a;
            border-top: 1px solid #3a3a3a;
            border-left: 1px solid #3a3a3a;
            border-right: 1px solid #0a0a0a;
            border-bottom: 1px solid #0a0a0a;
            padding: 5px;
            margin-bottom: 8px;
        }

        .pt-dial-glass {
            background: #b0c090;
            border: 1px solid #050505;
            height: 36px;
            position: relative;
            overflow: hidden;
        }

        .pt-dial-marks {
            display: flex;
            justify-content: space-around;
            height: 100%;
            align-items: flex-end;
            padding: 0 6px 3px 6px;
        }

        .pt-mark-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size:8px;
            font-weight: bold;
            color: #1a2010;
            font-family: 'Fira Mono', monospace;
        }

        .pt-mark-line { width: 1px; height: 6px; background: #1a2010; }
        .pt-mark-line.major { height: 12px; width: 2px; }

        .pt-dial-needle {
            position: absolute;
            width: 2px;
            height: 100%;
            background: #cc0000;
            top: 0;
            z-index: 5;
        }

        .pt-dial-needle::before {
            content: '';
            position: absolute;
            top: -3px; left: -3px;
            width: 8px; height: 4px;
            background: #cc0000;
        }

        /* Section blocks — flat silver */
        .pt-section {
            background: #c8c8c8;
            border-top: 1px solid #f0f0f0;
            border-left: 1px solid #f0f0f0;
            border-right: 1px solid #707070;
            border-bottom: 1px solid #707070;
            padding: 6px;
            margin-bottom: 4px;
        }

        .pt-section-label {
            font-size:8px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #1a1a1a;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Light variant for labels on dark grey panels */
        .pt-cd-section .pt-section-label,
        .vcr-tape-section .pt-section-label {
            color: #f0f0f0;
        }

        .pt-cd-section .pt-section-label span:last-child {
            color: #aaaaaa !important;
            font-weight: normal !important;
            letter-spacing: 1px !important;
        }

        .pt-row { display: flex; gap: 6px; align-items: center; }

        .pt-split-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            margin-bottom: 4px;
        }

        /* Buttons — Pioneer flat silver */
        .pt-pwr-btn, .pt-btn, .pt-preset-btn {
            background: #c8c8c8;
            color: #1a1a1a;
            border: 1px solid #888888;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Fira Sans Condensed', sans-serif;
        }

        .pt-pwr-btn {
            padding: 6px 8px;
            font-size:9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: auto;
            justify-content: center;
        }

        .pt-pwr-led, .vt-pwr-led {
            width: 8px; height: 8px;
            background: #2a0000;
            border: 1px solid #000;
        }

        .pt-pwr-btn.on .pt-pwr-led { background: #ff4444; }

        .pt-battery {
            flex: 1;
            background: #050505;
            border-top: 1px solid #2a2a2a;
            border-left: 1px solid #2a2a2a;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            height: 18px;
            position: relative;
        }

        /* Battery fill — flat colored segments instead of gradient */
        .pt-battery-fill, .vt-battery-fill {
            position: absolute;
            inset: 1px;
            background: #44cc44;
        }

        .pt-battery-fill.low, .vt-battery-fill.low { background: #cc8844; }
        .pt-battery-fill.crit, .vt-battery-fill.crit { background: #cc4444; }

        .pt-battery-pct, .vt-battery-pct {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size:9px;
            font-weight: bold;
            font-family: 'Fira Mono', monospace;
            color: #000;
            z-index: 2;
        }

        .pt-volume-bar {
            display: flex;
            gap: 2px;
            background: #050a14;
            border-top: 1px solid #2a2a2a;
            border-left: 1px solid #2a2a2a;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            padding: 4px;
            flex: 1;
        }

        .pt-vol-led, .vt-vol-led {
            flex: 1;
            height: 14px;
            background: #0a2a3a;
            border: 1px solid #000;
        }

        .pt-vol-led.active { background: #44bbdd; }
        .pt-vol-led.active.peak { background: #ee5544; }
        .pt-vol-icon { color: #1a1a1a; font-size:13px; font-weight: bold; width: 14px; text-align: center; }

        .pt-preset-buttons {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            margin-bottom: 6px;
        }

        .pt-preset-btn {
            padding: 8px 0;
            font-size:11px;
            text-align: center;
            font-family: 'Fira Mono', monospace;
        }

        .pt-preset-btn.active {
            background: #a8a8a8;
            color: #1a1a1a;
            border: 1px solid #555555;
        }

        .pt-preset-btn.active::after {
            content: '';
            position: absolute;
            top: -3px; left: 50%;
            transform: translateX(-50%);
            width: 5px; height: 5px;
            background: #ff5544;
        }

        .pt-dropdown {
            flex: 1;
            background: #050a14;
            border-top: 1px solid #2a2a2a;
            border-left: 1px solid #2a2a2a;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            color: #66ddff;
            padding: 6px 8px;
            font-size:11px;
            font-family: 'Fira Mono', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pt-btn {
            padding: 7px 8px;
            font-size:9px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            white-space: nowrap;
        }

        .pt-btn.tune {
            background: #c8c8c8;
            color: #1a1a1a;
            border: 1px solid #888888;
        }

        .pt-pinstripe {
            display: none;
        }

        /* ===========================================
           Radio layout components — new structure
           Top: controls strip
           Mid: preset bank, tune-in row, main display
           Bot: CD player (PT only)
           =========================================== */
        .radio-control-strip {
            display: flex;
            gap: 6px;
            align-items: center;
            margin-bottom: 6px;
            padding: 4px;
        }



        /* Pioneer-style recessed dark grey panel */
        .pt-control-strip-bg {
            background: #5a5a5a;
            border-top: 1px solid #3a3a3a;
            border-left: 1px solid #3a3a3a;
            border-right: 1px solid #757575;
            border-bottom: 1px solid #757575;
        }

        .vt-control-strip-bg {
            background: #0a0a0a;
            border-top: 1px solid #050505;
            border-left: 1px solid #050505;
            border-right: 1px solid #3a3a3a;
            border-bottom: 1px solid #3a3a3a;
        }

        .strip-divider {
            width: 1px;
            align-self: stretch;
            background: #707070;
        }

        .vt-control-strip-bg .strip-divider { background: #2a2520; }

        /* In-display BATT + VOL status row — 25%/75% split */
        .display-status-row {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 12px;
            padding: 4px 0;
            margin-bottom: 6px;
            border-bottom: 1px solid #1a3a4a;
        }

        .vt-lcd .display-status-row {
            border-bottom: 1px solid #2a2010;
        }

        .display-status-cell {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Fira Mono', monospace;
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .display-status-cell .key {
            color: #4499bb;
            min-width: 32px;
        }

        .vt-lcd .display-status-cell .key { color: #cc7722; }

        /* Segmented battery indicator — like volume, no % readout */
        .display-batt-bar {
            flex: 1;
            display: flex;
            gap: 1px;
            height: 9px;
        }

        .display-batt-seg {
            flex: 1;
            background: #0a2a3a;
            border: 1px solid #000;
        }

        .display-batt-seg.active { background: #66ddff; }

        .vt-lcd .display-batt-seg { background: #c47015; border-color: #2a1404; }
        .vt-lcd .display-batt-seg.active { background: #1a0500; }

        .display-vol-bar {
            flex: 1;
            display: flex;
            gap: 1px;

            background: #0a0a0a;
            border: 1px solid #000;
        }

        .dark-theme .tab-strip {
            background: #2a2a2a;
            border-left: 1px solid #000;
        }

        .dark-theme .tab-icon.active {
            background: #2a2a2a;
            position: relative;
        }
        .dark-theme .tab-icon.active::after {
            content: '';
            position: absolute;
            right: -4px;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #d97a1f;
        }

        .dark-theme .tab-divider {
            background: #000;
            margin: 2px 4px;
        }

        .dark-theme .tab-icon.disabled {
            color: #555;
            background: #1f1f1f;
        }

        .dark-theme .tab-count-badge {
            background: #d97a1f;
            color: #1a0500;
            border: 1px solid #000;
        }

        /* COMPACT CHROME */
        .title-icon {
            width: 12px; height: 12px;
            background: #444;
            border: 1px solid #000;
            margin-left: 4px;
            flex-shrink: 0;
        }
        .title-spacer { flex: 1; }
        .active-tab-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 9px;
            font-weight: bold;
            padding: 0 6px;
            font-family: 'Fira Sans Condensed', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .tab-pill-dot {
            width: 6px; height: 6px;
            background: #d97a1f;
            border-radius: 50%;
        }

        .drawer-column {
            width: 480px;
            display: flex;
            flex-direction: column;
        }

        .drawer-internal-header {
            background: #2a2a2a;
            padding: 3px 6px;
            display: flex;
            align-items: center;
            gap: 4px;
            border-bottom: 1px solid #000;
            min-height: 22px;
        }

        .drawer-browse-btn {
            width: 18px; height: 16px;
            background: #2a2a2a;
            border-top: 1px solid #4a4a4a;
            border-left: 1px solid #4a4a4a;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            color: #e0e0e0;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .drawer-browse-info {
            font-family: 'Fira Mono', monospace;
            font-size: 9px;
            color: #e0e0e0;
            padding: 0 6px;
        }

        .drawer-header-name {
            font-size: 10px;
            color: #e0e0e0;
            font-weight: bold;
            padding-left: 8px;
            border-left: 1px solid #4a4a4a;
            margin-left: 4px;
        }

        .drawer-header-spacer { flex: 1; }

        .resize-footer {
            background: #2a2a2a;
            border-top: 1px solid #000;
            height: 12px;
            position: relative;
        }
        .resize-grip {
            position: absolute;
            right: 2px;
            bottom: 2px;
            width: 8px;
            height: 8px;
            background:
                linear-gradient(135deg, transparent 0 35%, #888 35% 45%, transparent 45% 55%, #888 55% 65%, transparent 65% 75%, #888 75% 85%, transparent 85%);
        }
    </style>
</head>
<body>
    <div class="label-banner">▌ LUA RENDER PREVIEW — RADIO + TV CONTEXTUAL DRAWER — SEE SPEC.md</div>

            <div class="tab-strip">

                </div>
                <div class="tab-divider"></div>
                <div class="tab-icon" title="Crafting">CR</div>
                <div class="tab-icon" title="Building">BL</div>
                <div class="tab-icon disabled" title="Forage">FO</div>
                <div class="tab-icon disabled" title="Fishing">FI</div>
            </div>
        </div>

        <div class="resize-footer">
            <div class="resize-grip"></div>
        </div>
    </div>
