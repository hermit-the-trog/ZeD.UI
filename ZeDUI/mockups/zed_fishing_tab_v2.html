<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeD Fishing Tab</title>
<!-- ZeD-GUI mockup: the World window's contextual Fishing tab (punch list 167, beta 12), v1.
     Chrome and tokens copied from zed_identity_v2.html (window, title chip, sections, help band) and
     zed_tooltips_balloon_v1.html (keycaps, grooves); layout after ForagingTab.lua (pinned header strip,
     hero band, More detail fold, list, band at the foot) and the shipped World window strip.
     Game data: media/lua/shared/Fishing/{fishing_properties,FishingUtils,FishingRod,Fish,Bobber}.lua,
     client/Fishing/FishingStates.lua, client/PZAPI/ui/organisms/FishWindow.lua,
     client/ISUI/ISInventoryPaneContextMenu.lua (addFishRodOptions), shared/TimedActions/Fishing/*.
     Units: 1 CSS px here = 1 ZeD unit; the game draws 1 unit as 1.75 screen pixels at 4K. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Condensed:wght@400;500;600;700&display=swap');
:root {
  --base: #1a1a1e; --surface-1: #222226; --surface-2: #2a2a2e; --surface-3: #333338;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
  --text: #d4d4d8; --text-secondary: rgba(255,255,255,0.45); --text-heading: rgba(255,255,255,0.65);
  --accent: #47a18c; --acc-text: var(--accent); --on-accent: #0c0c0c;
  --danger: #c44040; --warning: #c49040; --positive: #4a9a5a; --gold: #d4a63a;
  --stripe-1: #333338; --stripe-2: #2a2a2e;
  --font-mono: 'Fira Mono', monospace; --font-sans: 'Fira Sans Condensed', sans-serif;
  --page: #0e0f10; --grass: #3b4527; --grass2: #36401f; --water: #26414c; --water2: #2a4752;
}
:root[data-theme="light"] { --acc-text: color-mix(in srgb, var(--accent) 70%, #000); --on-accent: #fff;
  --base: #e9e7e2; --surface-1: #f2f0eb; --surface-2: #dddad3; --surface-3: #cfcbc2;
  --border: rgba(0,0,0,0.14); --border-strong: rgba(0,0,0,0.30);
  --text: #1d1d1f; --text-secondary: rgba(0,0,0,0.55); --text-heading: rgba(0,0,0,0.70);
  --stripe-1: #cfcbc2; --stripe-2: #dddad3; --page: #8c8a84;
  --danger: #a83030; --warning: #8a6420; --positive: #3a7a48; --gold: #8a6a10;
}
:root[data-theme="hc"] {
  --base: #000; --surface-1: #0a0a0a; --surface-2: #141414; --surface-3: #262626;
  --border: rgba(255,255,255,0.45); --border-strong: rgba(255,255,255,0.85);
  --text: #fff; --text-secondary: rgba(255,255,255,0.80); --text-heading: #fff; --stripe-1: #444; --stripe-2: #111;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { font-family: var(--font-sans); font-size: 15px; }

/* ---------- review bar (mockup only, not game UI) */
.review { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: center; padding: 8px 16px;
  font-family: var(--font-mono); font-size: 12px; color: #aaa; background: #000; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 5; }
.review b { color: #ddd; font-weight: 500; margin-right: 4px; }
.review button { font-family: var(--font-mono); font-size: 12px; background: #1b1b1b; color: #ccc; border: 1px solid #444; padding: 3px 8px; cursor: pointer; }
.review button.on { border-color: #ddd; color: #fff; }
.review .grp { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }

.stage { display: flex; justify-content: center; padding: 16px; overflow: hidden; }
.stage.actual { overflow: auto; justify-content: flex-start; }
.zoomer { transform-origin: top left; }
.notes { max-width: 980px; margin: 0 auto; padding: 4px 16px 48px; color: #c8c8c8; font-size: 15px; line-height: 1.45; }
.notes h2 { font: 700 12px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: #8fc9b9; margin: 18px 0 8px; }
.notes p { margin: 0 0 8px; max-width: 80ch; }
.notes ol, .notes ul { margin: 0 0 8px; padding-left: 20px; max-width: 84ch; }
.notes li { margin-bottom: 4px; }
.notes code { font-family: var(--font-mono); font-size: 13px; color: #e6e6e6; }

/* ---------- the screen (Screen view) */
.screen { position: relative; width: 2194px; height: 1234px; background: var(--grass); overflow: hidden; }
.screen .river { position: absolute; inset: 0; background: var(--water); clip-path: polygon(58% 0, 100% 0, 100% 100%, 34% 100%, 46% 62%, 52% 30%); }
.screen .bank { position: absolute; inset: 0; background: var(--grass2); clip-path: polygon(54% 0, 58% 0, 52% 30%, 46% 62%, 34% 100%, 30% 100%, 42% 62%, 48% 30%); }
.screen .who { position: absolute; left: 1020px; top: 620px; width: 14px; height: 30px; background: #6a6a70; border: 1px solid #000; }
.screen .bob { position: absolute; left: 1210px; top: 470px; width: 8px; height: 8px; background: #c03a2a; border: 1px solid #000; }
.screen .rodph { position: absolute; left: 50%; transform: translateX(-50%); bottom: 104px; width: 420px; height: 150px; border: 1px solid rgba(255,255,255,.35);
  background: rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; text-align: center; font: 400 14px/1.4 var(--font-mono); color: #ddd; padding: 12px; }
.screen .beltph { position: absolute; left: 50%; transform: translateX(-50%); bottom: 24px; width: 560px; height: 64px; border: 1px solid rgba(255,255,255,.35);
  background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; font: 400 14px/1 var(--font-mono); color: #ddd; }
.screen .winat { position: absolute; left: 24px; top: 24px; }

/* ---------- ZeD window chrome (from zed_identity_v2.html) */
.win { display: flex; flex-direction: column; background: color-mix(in srgb, var(--base) 92%, transparent); border: 1px solid var(--border-strong); width: 518px; }
.titlebar { height: 22px; flex: 0 0 22px; display: flex; align-items: center; gap: 10px; padding: 0 8px; position: relative;
  background: repeating-linear-gradient(to bottom, var(--stripe-1) 0 2px, var(--stripe-2) 2px 4px); border-bottom: 1px solid var(--border-strong); }
.close { width: 12px; height: 12px; border: 1px solid var(--border-strong); background: var(--surface-1); flex: 0 0 12px; }
.titlechip { position: absolute; left: 50%; transform: translateX(-50%); background: var(--surface-2); padding: 0 8px; font-family: var(--font-mono); font-size: 13px; line-height: 22px; color: var(--acc-text); white-space: nowrap; }
.titlechip .plus { color: var(--text-secondary); margin: 0 6px; }
.wbody { display: flex; height: 664px; }
.drawer { width: 480px; flex: 0 0 480px; display: flex; flex-direction: column; min-height: 0; position: relative; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overflow-x: visible; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }

/* the tab strip on the window's side (as shipped: icons in a column, groups split by a groove) */
.strip { width: 36px; flex: 0 0 36px; border-left: 1px solid var(--border); display: flex; flex-direction: column; align-items: stretch; padding-top: 2px; }
.strip .t { height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); position: relative; }
.strip .t.on { background: var(--accent); color: var(--on-accent); }
.strip .t.ctx::after { content: ""; position: absolute; left: 3px; top: 3px; width: 3px; height: 3px; background: currentColor; opacity: .7; }
.strip .gap { height: 0; border-top: 1px solid var(--border); margin: 4px 6px; }
.strip svg { display: block; }

/* ---------- drawer parts */
.hdr { height: 30px; flex: 0 0 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.state { display: inline-flex; align-items: center; gap: 6px; font: 700 12px/1 var(--font-mono); color: var(--text); }
.dot { width: 7px; height: 7px; flex: 0 0 7px; background: var(--text-secondary); display: inline-block; }
.dot.pos { background: var(--positive); } .dot.acc { background: var(--accent); } .dot.warn { background: var(--warning); } .dot.bad { background: var(--danger); } .dot.dim { background: transparent; border: 1px solid var(--text-secondary); }
.hdr .r { margin-left: auto; font: 400 12px/1 var(--font-mono); color: var(--text-secondary); white-space: nowrap; }

/* the progress band (item card scaffold: accent, danger by class flip) */
.pband { display: flex; align-items: center; gap: 10px; height: 26px; padding: 0 12px; background: color-mix(in srgb, var(--accent) 22%, var(--surface-1)); border-bottom: 1px solid var(--border);
  font: 700 12px/1 var(--font-mono); color: var(--acc-text); text-transform: uppercase; letter-spacing: .06em; }
.pband.danger { background: color-mix(in srgb, var(--danger) 22%, var(--surface-1)); color: var(--danger); }
.pband .r { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--text); }

.hero { display: flex; gap: 0; border-bottom: 1px solid var(--border); }
.hero .pic { width: 64px; flex: 0 0 64px; display: flex; align-items: flex-start; justify-content: center; padding-top: 10px; }
.iconbox { width: 44px; height: 44px; background: var(--surface-3); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; }
.hero .info { flex: 1; min-width: 0; padding: 8px 10px 10px 0; }
.hero .name { font: 600 16px/1.2 var(--font-sans); color: var(--text); margin-bottom: 6px; }
.kv { display: grid; grid-template-columns: 44px 1fr; gap: 3px 8px; align-items: center; }
.kv dt { font: 400 12px/18px var(--font-mono); color: var(--text-secondary); }
.kv dd { margin: 0; display: flex; align-items: center; gap: 6px; font: 400 14px/18px var(--font-sans); min-width: 0; }
.kv dd .sub { color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px; }
.kv dd.bad { color: var(--danger); }
.bar { width: 64px; height: 6px; background: var(--surface-3); position: relative; flex: 0 0 64px; }
.bar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); opacity: .85; }
.bar.warn > i { background: var(--warning); }
.num { font-family: var(--font-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text); }
.hero .skill { width: 112px; flex: 0 0 112px; border-left: 1px solid var(--border); padding: 8px 10px; display: flex; flex-direction: column; gap: 5px; }
.skill .lab { font: 700 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text-heading); }
.skill .lv { font: 600 16px/1 var(--font-sans); color: var(--acc-text); font-variant-numeric: tabular-nums; }
.skill .lv span { font: 400 12px/1 var(--font-mono); color: var(--text-secondary); margin-left: 4px; }
.pips { display: flex; gap: 2px; }
.pips i { width: 7px; height: 7px; border: 1px solid var(--border-strong); }
.pips i.f { background: var(--accent); border-color: var(--accent); }
.pips i.p { background: linear-gradient(to right, var(--accent) 0 62%, transparent 62%); }
.skill .xp { font: 400 11px/1.3 var(--font-mono); color: var(--text-secondary); }

.chips { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 12px 8px; border-bottom: 1px solid var(--border); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; background: var(--surface-2); border: 1px solid var(--border); font: 400 12px/16px var(--font-mono); color: var(--text); white-space: nowrap; }
.chip .k { color: var(--text-secondary); }

.sec { padding: 6px 12px 4px; background: var(--surface-1); border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-weight: 700; font-size: 12px; color: var(--text-heading); display: flex; align-items: center; gap: 6px; }
.sec .r { margin-left: auto; font-weight: 400; color: var(--text-secondary); }
.sec.fold { cursor: pointer; }
.tri { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--text-heading); display: inline-block; }
.tri.shut { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid var(--text-heading); border-right: 0; }

.rows { display: flex; flex-direction: column; }
.row { position: relative; display: flex; align-items: center; gap: 8px; height: 24px; padding: 0 12px; font: 400 14px/1 var(--font-sans); cursor: default; }
.row.sel { background: var(--accent); color: var(--on-accent); }
.row.sel .dim, .row.sel .num { color: var(--on-accent); }
.row .dim { color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px; }
.row .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .w { width: 44px; text-align: right; }
.row .tm { width: 48px; flex: 0 0 48px; white-space: nowrap; }
.row .bt { width: 70px; flex: 0 0 70px; }
.tag { display: inline-flex; align-items: center; gap: 4px; font: 400 11px/14px var(--font-mono); padding: 0 5px; border: 1px solid currentColor; white-space: nowrap; }
.row.sel .tag { color: var(--on-accent); }
.colhead { display: flex; gap: 8px; padding: 4px 12px 2px; font: 400 11px/1 var(--font-mono); color: var(--text-secondary); }
.colhead .grow { flex: 1; } .colhead .w { width: 44px; text-align: right; } .colhead .tm { width: 48px; } .colhead .bt { width: 70px; }
.empty { padding: 8px 12px 10px; font: 400 14px/1.4 var(--font-sans); color: var(--text); }
.empty.bad { color: var(--danger); }

.facts { display: grid; grid-template-columns: 150px 1fr; gap: 4px 10px; padding: 8px 12px 10px; }
.facts dt { font: 400 12px/18px var(--font-mono); color: var(--text-secondary); }
.facts dd { margin: 0; font: 400 14px/18px var(--font-sans); }
.facts dd .sub { color: var(--text-secondary); font-family: var(--font-mono); font-size: 12px; }

.groups { display: grid; grid-template-columns: 84px 1fr; gap: 3px 10px; padding: 8px 12px 10px; }
.groups dt { font: 700 12px/18px var(--font-mono); color: var(--text-heading); }
.groups dd { margin: 0; font: 400 14px/18px var(--font-sans); }
.where { display: flex; flex-direction: column; gap: 6px; padding: 8px 12px 10px; }
.where .w1 { display: flex; gap: 8px; align-items: flex-start; font: 400 14px/1.35 var(--font-sans); }
.where .w1 b { font: 700 12px/18px var(--font-mono); color: var(--acc-text); flex: 0 0 96px; font-weight: 700; }

/* tension block */
.tens { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--border); }
.tens .lrow { display: flex; align-items: baseline; gap: 8px; }
.tens .lab { font: 700 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--text-heading); }
.tens .val { margin-left: auto; font: 700 14px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.tbar { position: relative; height: 14px; background: var(--surface-3); border: 1px solid var(--border-strong); }
.tbar > i { position: absolute; left: 0; top: 0; bottom: 0; }
.tbar .mk { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--text); }
.tscale { position: relative; height: 12px; font: 400 11px/12px var(--font-mono); color: var(--text-secondary); }
.tscale span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.tscale span.l { transform: none; } .tscale span.rt { transform: translateX(-100%); }
.hbar { position: relative; height: 6px; background: var(--surface-3); }
.hbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--danger); }
.tline { font: 400 14px/1.35 var(--font-sans); }
.tline .k { font: 400 12px var(--font-mono); color: var(--text-secondary); margin-right: 6px; }

.helpband { min-height: 28px; display: flex; align-items: center; padding: 5px 12px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 14px; line-height: 1.3; color: var(--text-secondary); }

/* the band at the foot: status left, keycaps right, default rightmost */
.foot { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 6px 10px 7px 12px; background: var(--surface-2); border-top: 1px solid var(--border-strong); min-height: 38px; }
.foot .st { flex: 1; min-width: 0; font: 400 12px/1.3 var(--font-mono); color: var(--text-secondary); }
.btn { position: relative; padding: 4px 12px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface-2); color: var(--text);
  font: 400 13px/16px var(--font-mono); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn::before { content: ""; position: absolute; inset: 2px; border: 1px solid var(--border-strong); border-radius: 2px; pointer-events: none; }
.btn.default, .btn.default::before { border-color: var(--accent); } .btn.default { color: var(--acc-text); }
.btn.danger, .btn.danger::before { border-color: var(--danger); } .btn.danger { color: var(--danger); }
.btn:disabled { cursor: default; color: color-mix(in srgb, var(--text) 40%, transparent); border-color: color-mix(in srgb, var(--border-strong) 50%, transparent); }
.btn:disabled::before { border-color: color-mix(in srgb, var(--border-strong) 50%, transparent); }
.btn:hover:not(:disabled) { color: var(--acc-text); }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 14px; padding: 0 3px; background: var(--text); color: var(--base); font: 700 10px/14px var(--font-mono); border-radius: 2px; }

/* controller highlight: the pointing hand at the left of the focused control */
.hand { position: absolute; left: -9px; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 3; }
.foot .btn .hand { left: -14px; }
.row.pf { padding-left: 22px; } .row.pf > .hand, .sec.pf > .hand { left: 3px; } .sec.pf { padding-left: 22px; }
dl { margin: 0; }
.btn.pf { margin-left: 14px; }
.px { image-rendering: pixelated; shape-rendering: crispEdges; display: block; }

/* v2: the trophy wall keycap in the log's header, bait ratings */
.btn.sm { padding: 1px 9px; font-size: 12px; line-height: 15px; font-weight: 400; }
.btn .cnt { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.sec .btn.sm { margin-left: 8px; }
.rate { display: grid; grid-template-columns: 104px 1fr; gap: 2px 10px; padding: 6px 12px 8px; background: color-mix(in srgb, var(--surface-1) 50%, transparent); }
.rate dt { font: 400 12px/18px var(--font-mono); color: var(--text-secondary); }
.rate dd { margin: 0; font: 400 14px/18px var(--font-sans); }
.rate .cap { grid-column: 1 / -1; font: 700 11px/16px var(--font-mono); color: var(--text-heading); text-transform: uppercase; letter-spacing: .06em; }

/* v2: the trophy wall, a full-width card pushed over the tab (back bar on top) */
.backbar { height: 30px; flex: 0 0 30px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--surface-1); }
.backbar .back { display: inline-flex; align-items: center; gap: 6px; font: 400 12px/1 var(--font-mono); color: var(--acc-text); cursor: pointer; position: relative; padding: 4px 0; }
.trl { width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-right: 5px solid var(--acc-text); display: inline-block; }
.backbar .ttl { font: 700 12px/1 var(--font-mono); color: var(--text); margin-left: 6px; }
.backbar .r { margin-left: auto; font: 400 12px/1 var(--font-mono); color: var(--text-secondary); }
.modes { display: flex; align-items: center; gap: 14px; padding: 7px 12px; border-bottom: 1px solid var(--border); }
.radio { display: inline-flex; align-items: center; gap: 6px; font: 400 13px/1 var(--font-mono); color: var(--text); cursor: pointer; position: relative; padding: 2px 0; }
.radio i { width: 13px; height: 13px; border: 1px solid var(--border-strong); border-radius: 50%; background: var(--surface-2); display: grid; place-content: center; }
.radio.on i::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.radio.pf { padding-left: 18px; } .radio.pf > .hand { left: 0; }
.modes .r { margin-left: auto; font: 400 12px/1 var(--font-mono); color: var(--text-secondary); }
.wall { padding: 18px 12px 22px; display: grid; grid-template-columns: 216px 216px; gap: 22px 24px; justify-content: center; }
/* (the director, Nov 11: no background wall; the plaques sit on the window's own surface) */
.plq { position: relative; width: 216px; height: 156px; cursor: pointer; }
.plq > svg { position: absolute; inset: 0; }
.plq.sel::after { content: ""; position: absolute; inset: -4px; border: 1px solid var(--accent); pointer-events: none; }
.plq .hand { left: 3px; top: 36px; transform: none; }
.plate { position: absolute; left: 12px; right: 12px; bottom: 12px; padding: 3px 6px 4px; background: #b48f3e; border: 1px solid #4a3812; border-top-color: #e0c06a;
  color: #241905; text-align: center; }
.plate b { display: block; font: 600 12px/15px var(--font-sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plate span { display: block; font: 400 11px/14px var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.medal { position: absolute; left: 12px; top: 9px; width: 18px; height: 18px; border: 1px solid #1a1206; font: 700 11px/16px var(--font-mono); text-align: center; color: #1a1206; }
.medal.n { background: #3a2412; color: #d8b862; border-color: #1a1206; }
.ghost { position: absolute; inset: 0; border: 1px solid rgba(216,184,98,.28); background: rgba(0,0,0,.18); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  font: 400 12px/1 var(--font-mono); color: rgba(216,184,98,.6); }
.record { flex: 0 0 auto; padding: 7px 12px 8px; background: var(--surface-2); border-top: 1px solid var(--border); }
.record b { display: block; font: 600 15px/1.25 var(--font-sans); color: var(--text); }
.record .fx { display: flex; flex-wrap: wrap; gap: 2px 14px; margin-top: 3px; font: 400 12px/16px var(--font-mono); color: var(--text-secondary); }
.record .fx em { font-style: normal; color: var(--text); }

function fishPixels(kind, ox, oy) {
  const k = FISHK[kind], L = k.L, cy = oy + 8; const cells = {};
  const put = (x, y, c) => { cells[x + "," + y] = c; };
  for (let x = 0; x < L; x++) {
    const t = x / L;
    let h = k.D * Math.pow(Math.sin(Math.PI * Math.min(1, (t + 0.05) / 1.1)), 0.7);
    if (t > 0.82) h = Math.max(1, h * (1 - (t - 0.82) * 3));
    const top = Math.round(cy - h - (k.hump && t > 0.15 && t < 0.5 ? 1 : 0)), bot = Math.round(cy + h * 0.85);
    for (let y = top; y <= bot; y++) {
      let c = y < cy - h * 0.35 ? k.back : (y > cy + h * 0.35 ? k.belly : k.side);
      if (k.mark === "band" && y === cy && x > 5 && x < L - 5) c = k.back;
      if (k.mark === "bars" && x > 6 && x < L - 6 && x % 5 === 0 && y < cy + 1) c = k.back;
      if (k.mark === "spots" && (x * 7 + y * 13) % 11 === 0 && y < cy + 1 && x > 4) c = k.back;
      put(ox + x, y, c);
    }
    if (t > 0.35 && t < 0.62) put(ox + x, top - 1, k.fin);   // the dorsal fin
  }
  for (let i = 0; i < 6; i++) for (let y = -i - 1; y <= i + 1; y++) if (Math.abs(y) >= i - 1) put(ox + L + i, cy + y, k.fin);   // the tail
  put(ox + 3, cy - 1, "#111"); put(ox + 1, cy + 1, "#2a1a10");   // the eye, the mouth
  if (k.whisk) { put(ox - 1, cy, "#2a2a2a"); put(ox - 2, cy + 1, "#2a2a2a"); put(ox - 1, cy - 2, "#2a2a2a"); put(ox - 2, cy - 3, "#2a2a2a"); }
  // a 1-pixel dark outline round the fish so it reads on the stained board
  const out = {};
  for (const key in cells) { const [x, y] = key.split(",").map(Number);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx, dy]) => { const n = (x + dx) + "," + (y + dy); if (!cells[n]) out[n] = "#1c1008"; }); }
  let r = "";
  for (const key in out) { const [x, y] = key.split(","); r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${out[key]}"/>`; }
  for (const key in cells) { const [x, y] = key.split(","); r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${cells[key]}"/>`; }
  return r;
}

function plaqueSvg(kind) {
  let r = `<polygon points="3,0 69,0 72,3 72,49 69,52 3,52 0,49 0,3" fill="#1c1008"/>
    <polygon points="4,1 68,1 71,4 71,48 68,51 4,51 1,48 1,4" fill="#6b3f1f"/>
    <polygon points="5,3 67,3 69,5 69,47 67,49 5,49 3,47 3,5" fill="#7a4924"/>
    <rect x="5" y="3" width="62" height="1" fill="#93603a"/><rect x="3" y="5" width="1" height="42" fill="#93603a"/>
    <rect x="5" y="48" width="62" height="1" fill="#4e2c14"/><rect x="68" y="5" width="1" height="42" fill="#4e2c14"/>
    <rect x="9" y="9" width="14" height="1" fill="#6b3f1f"/><rect x="40" y="13" width="20" height="1" fill="#6b3f1f"/><rect x="14" y="27" width="22" height="1" fill="#6b3f1f"/>
    <rect x="35" y="5" width="2" height="2" fill="#c9a23a"/>`;
  const k = FISHK[kind]; const ox = Math.round((72 - k.L - 6) / 2);
  r += fishPixels(kind, ox, 7);
  return `<svg class="px" width="216" height="156" viewBox="0 0 72 52" aria-hidden="true">${r}</svg>`;
}

  const rate = SKILL.lv >= 6 ? `<dl class="rate"><span class="cap">${esc(BAITS.find(b => b.id === pick).name)} for the 8 species you have caught</span>${rated}</dl>` : "";

    <div class="colhead"><span class="grow">Bait</span><span>In</span><span class="w">Count</span></div>
    <div class="rows">${rows}</div>${rate}`;
}

function logRows(list, focusable) {
  return list.map((c, i) => `<div class="row" ${focusable ? f("log-" + i) : ""}>
      <span class="num tm dim">${c.t}</span>${px(c.icon, 1.5)}

      ${c.junk ? `<span class="tag" style="color:var(--text-secondary)">Junk</span>` : ""}
      <span class="dim bt">${esc(c.bait)}</span><span class="num w">${c.wt || "-"}</span></div>`).join("");
}
// v2: the catch log for the whole game, newest first (20 shown); the trophy wall keycap sits in its header
function logSection(n, full) {
  const today = n <= LOG.length ? LOG.slice(0, n) : LOG.slice();
  const all = OLD.concat(today).reverse();
  const list = full ? all.slice(0, 20) : all.slice(0, Math.min(n, LOG.length));
  const wall = `<button class="btn sm" ${f("btn-wall")} data-act="btn-wall">Trophy wall <span class="cnt">8</span></button>`;
  return `<div class="sec">CATCH LOG<span class="r">${full ? `20 of ${LOG_TOTAL}` : `${LOG_TOTAL} this game`}</span>${wall}</div>
    <div class="colhead"><span class="tm">When</span><span class="grow" style="padding-left:26px">Catch</span><span class="bt">Bait</span><span class="w">Wt</span></div>
    <div class="rows">${logRows(list, full)}</div>`;
}

function detail() {
  const head = `<div class="sec fold" ${f("fold")} data-act="fold"><span class="tri ${S.fold ? "" : "shut"}"></span>MORE DETAIL<span class="r">what Fishing ${SKILL.lv} gives</span></div>`;

  // Fishing.Utils.skillSizeLimit, fishSizeChancesBySkillLevel (near shore halves Medium and Big),

  return head + `<dl class="facts">
    <dt>Species you can hook</dt><dd>Up to 4.5 kg <span class="sub">Fishing 7: 9 kg</span></dd>

function tension() {
  const v = 86;   // FishingRod:getTension, 0 to 1 (below 0 slack, past 1 it snaps)
  const col = v >= 80 ? "var(--danger)" : v >= 50 ? "var(--gold)" : "var(--accent)";
  return `<div class="tens">
    <div class="lrow"><span class="lab">Tension</span><span class="val" style="color:${col}">${v}%</span></div>

    <div class="lrow" style="margin-top:2px"><span class="lab">Held at the limit</span><span class="val" style="color:var(--text);font-weight:400;font-size:12px">45%</span></div>

    <div class="tline"><span class="k">Fish</span>Unknown until landed</div>

}

/* ---------- v2: the trophy wall card */
function wallItems() {
  if (S.wall === "top") return TROPHIES.slice().sort((a, b) => b.wt - a.wt).slice(0, 10).map((t, i) => ({ t, rank: i + 1 }));
  return SPECIES.map(([id, nm, kind]) => {
    const best = TROPHIES.filter(t => t.sp === id).sort((a, b) => b.wt - a.wt)[0];
    return { t: best || null, sp: nm, kind };
  });
}
function kindOf(sp) { return SPECIES.find(s => s[0] === sp)[2]; }
function trophyCard() {
  const items = wallItems();
  const MEDAL = ["#c9a23a", "#aab0b6", "#a86a3a"];

    const sel = S.plq === i ? "sel" : "";
    if (!it.t) return `<div class="plq ${sel}" ${f("plq-" + i)} data-plq="${i}"><div class="ghost">${px("tFish", 3).replace('class="px"', 'class="px" style="color:rgba(216,184,98,.35)"')}Not caught yet</div></div>`;
    const t = it.t;
    const medal = it.rank ? `<span class="medal ${it.rank > 3 ? "n" : ""}" style="${it.rank <= 3 ? `background:${MEDAL[it.rank - 1]}` : ""}">${it.rank}</span>` : "";
    return `<div class="plq ${sel}" ${f("plq-" + i)} data-plq="${i}">${plaqueSvg(kindOf(t.sp))}${medal}
      <div class="plate"><b>${esc(t.name)}</b><span>${t.wt.toFixed(2)} | ${t.date}</span><span>${esc(t.where)} | ${esc(t.bait)}</span></div></div>`;
  }).join("");
  const cur = items[S.plq] || items[0];
  const rec = cur.t
    ? `<b>${esc(cur.t.name)}</b><div class="fx"><span>Weight <em>${cur.t.wt.toFixed(2)}</em></span><span>Length <em>${cur.t.len}cm</em></span><span>Caught <em>${cur.t.date}, ${cur.t.time}</em></span>
       <span>At <em>${esc(cur.t.where)}</em></span><span>Bait <em>${esc(cur.t.bait)}</em></span><span>Rod <em>Fishing Rod</em></span><span>Fishing <em>${cur.t.lv}</em></span>${cur.rank ? `<span>Rank <em>${cur.rank} of 10</em></span>` : ""}</div>`
    : `<b style="color:var(--text-secondary)">Not caught yet</b><div class="fx"><span>One of the 13 species still to catch; some are heavier than Fishing 6 can hook.</span></div>`;
  const tabs = `<span class="radio ${S.wall === "top" ? "on" : ""}" ${f("mode-top")} data-act="mode-top"><i></i>Top 10</span>

  return `<div class="drawer">

    <div class="modes">${tabs}</div>

    <div class="record">${rec}</div>

  </div>`;
}

  } else if (st === "nobait") {
    hdr = `<span class="state" style="color:var(--danger)"><span class="dot bad"></span>No bait</span>${where}`;
    body = hero() + chips()

         <div class="empty bad">Nothing in your bags works as bait. With a bare hook, only junk bites: Seaweed, Tin Can, Rag (Dirty).</div>
         <div class="sec">WHAT FISH TAKE</div>
         <dl class="groups">
           <dt>Worms</dt><dd>Worm, Maggots</dd>
           <dt>Insects</dt><dd>Cricket, Grasshopper, Cockroach, Pillbug, Termites, caterpillars</dd>
           <dt>Leeches</dt><dd>Leech, Snail, Slug</dd>

           <dt>Plants</dt><dd>Bread, Cheese, Dough, Canned Corn (Open)</dd>
           <dt>Lures</dt><dd>Jig Lure, Minnow Lure: rarely lost</dd>
         </dl>
         <div class="sec">WHERE TO GET IT</div>
         <div class="where">
           <div class="w1"><b>Foraging</b><span>The Fish Bait category: worms, insects, snails and slugs on the ground nearby.</span></div>
           <div class="w1"><b>Fishing Net</b><span>Set in the water, it catches Little Bait Fish, Tadpoles and Crayfish.</span></div>
           <div class="w1"><b>Your food</b><span>Bread, Cheese, Dough or an open can of dog food work, raw.</span></div>
         </div>`
      + logSection(3, false);
    foot = `<span class="st">${S.msg || "Only junk bites a bare hook."}</span>
      ${btn("btn-cast", "Cast", { pad: "RT" })}${btn("btn-search", "Search for bait", { def: true, pad: "Y" })}`;
  } else {

      + `<div class="sec">THIS TRIP<span class="r">since 05:02</span></div>
         <dl class="facts">
           <dt>Landed</dt><dd>${fish.length} fish <span class="sub">1 junk | 2 got away</span></dd>
           <dt>Heaviest</dt><dd>Medium Yellow Perch - 19cm <span class="sub">0.71</span></dd>
           <dt>Total weight</dt><dd>2.68 <span class="sub">fish only</span></dd>
           <dt>Bait used</dt><dd>4 Worm, 1 Cricket</dd>
           <dt>Line</dt><dd>91% to 82%</dd>
           <dt>Species found</dt><dd>8 of 21 <span class="sub">the game's own record</span></dd>

}

function strip() {
  const t = (g, on, ctx) => `<div class="t ${on ? "on" : ""} ${ctx ? "ctx" : ""}">${px(g, 2)}</div>`;
  return `<div class="strip">${t("tLoot")}${t("tCraft")}${t("tBuild")}${t("tFurn")}<div class="gap"></div>${t("tMaps")}${t("tForage")}${t("tAnimals")}${t("tFish", true, true)}</div>`;
}

function windowHtml() {
  return `<div class="win" id="win">
    <div class="titlebar"><div class="close"></div><div class="titlechip">World<span class="plus">+</span>Fishing</div></div>
    <div class="wbody">${drawer()}${strip()}</div>
  </div>`;
}

function screenHtml() {
  const line = S.st === "wait" || S.st === "fight";
  return `<div class="screen"><div class="river"></div><div class="bank"></div><div class="who"></div>${line ? `<div class="bob"></div>` : ""}
    ${line ? `<div class="rodph">Rod in hand: ZeD's tension meter<br>(shipped, unchanged)</div>` : ""}
    <div class="beltph">Character window belt</div>
    <div class="winat">${windowHtml()}</div></div>`;
}

/* ======================================================================
   Review bar, render, scale, input
   ====================================================================== */
function review() {
  const b = (k, v, l) => `<button class="${S[k] === v ? "on" : ""}" data-set="${k}:${v}">${l}</button>`;
  return `<span class="grp"><b>State</b>${STATES.map(([v, l]) => b("st", v, l)).join("")}</span>
    <span class="grp"><b>Theme</b>${b("theme", "dark", "Dark")}${b("theme", "light", "Light")}${b("theme", "hc", "High contrast")}</span>
    <span class="grp"><b>Input</b>${b("input", "mouse", "Mouse")}${b("input", "pad", "Controller")}</span>
    <span class="grp"><b>View</b>${b("view", "window", "Window, fit")}${b("view", "screen", "4K screen, fit")}${b("view", "actual", "4K at 1.75x, actual")}</span>`;
}

function render() {
  document.documentElement.dataset.theme = S.theme;
  document.getElementById("review").innerHTML = review();
  const z = document.getElementById("zoomer");
  const old = z.querySelector(".scroll"), keep = old ? old.scrollTop : 0, keptSt = S._lastSt;
  z.innerHTML = S.view === "screen" ? screenHtml() : windowHtml();
  const sc = z.querySelector(".scroll"); if (sc && keptSt === S.st + S.wall) sc.scrollTop = keep;
  S._lastSt = S.st + S.wall;
  placeHand();
  fit();
  document.getElementById("notes").innerHTML = notes();
}

function focusables() { return [...document.querySelectorAll("#zoomer [data-f]")].filter(el => !el.disabled); }
function placeHand() {
  if (S.input !== "pad") return;
  const list = focusables();
  if (!list.length) return;
  let el = list.find(e => e.dataset.f === S.focus);
  if (!el) { el = list.find(e => e.dataset.f === DEFAULT_FOCUS[S.st]) || list[0]; S.focus = el.dataset.f; }
  el.style.position = "relative";
  if (el.classList.contains("row") || el.classList.contains("sec") || el.classList.contains("radio") || (el.classList.contains("btn") && !el.classList.contains("sm"))) el.classList.add("pf");
  if (el.classList.contains("btn") && el.classList.contains("sm")) el.style.marginLeft = "22px";
  el.insertAdjacentHTML("beforeend", `<span class="hand">${px("hand", 1)}</span>`);
  if (el.dataset.plq) { const sc = el.closest(".scroll"); if (sc) { const top = el.offsetTop - sc.offsetTop; if (top < sc.scrollTop || top + el.offsetHeight > sc.scrollTop + sc.clientHeight) sc.scrollTop = top - 18; } }
}

function fit() {
  const z = document.getElementById("zoomer"), stage = document.getElementById("stage");
  const inner = z.firstElementChild; if (!inner) return;
  const w = inner.offsetWidth, h = inner.offsetHeight;
  let k;
  if (S.view === "actual") { k = 1.75 / (window.devicePixelRatio || 1); stage.classList.add("actual"); }
  else {
    stage.classList.remove("actual");
    const availW = Math.max(200, window.innerWidth - 32);
    const availH = Math.max(200, window.innerHeight - document.getElementById("review").offsetHeight - 32);
    k = Math.min(availW / w, availH / h);
    if (S.view === "window") k = Math.min(k, 2.2);
  }
  z.style.transform = `scale(${k})`;
  z.style.width = w + "px"; z.style.height = h + "px";
  stage.style.height = (h * k + 32) + "px";
  z.style.marginRight = (w * k - w) + "px";
}

function act(id) {
  S.msg = "";
  if (id === "btn-cast") { if (S.st !== "nobait") { S.st = "wait"; S.focus = null; } else S.msg = "Cast with a bare hook: only junk bites."; }
  else if (id === "btn-reel") { if (S.st === "wait") S.st = "fight"; else if (S.st === "fight") { S.st = "log"; S.msg = "Landed: Small Channel Catfish - 14cm."; } S.focus = null; }
  else if (id === "btn-let") { S.msg = ""; }
  else if (id === "btn-stop") { S.st = "ready"; S.focus = null; }
  else if (id === "btn-bait") { if (S.sel !== S.onHook) { S.onHook = S.sel; S.msg = "Bait changed."; } }
  else if (id === "btn-search") { S.msg = "Opens the Foraging tab, Fish Bait chosen."; }
  else if (id === "btn-clear") { S.msg = "Clear log asks first, in this band."; }
  else if (id === "fold") { S.fold = !S.fold; }
  else if (id === "btn-wall") { S.from = S.st; S.st = "trophy"; S.plq = 0; S.focus = null; }
  else if (id === "btn-back" || id === "btn-back2") { S.st = S.from === "trophy" ? "log" : S.from; S.focus = "btn-wall"; }
  else if (id === "mode-top" || id === "mode-each") { S.wall = id === "mode-top" ? "top" : "each"; S.plq = 0; }
  render();
}

document.addEventListener("click", e => {
  const set = e.target.closest("[data-set]");
  if (set) { const [k, v] = set.dataset.set.split(":"); S[k] = v; if (k === "st") { S.focus = null; S.msg = ""; } render(); return; }
  const a = e.target.closest("[data-act]");
  if (a && !a.disabled) { if (a.dataset.f) S.focus = a.dataset.f; act(a.dataset.act); return; }
  const r = e.target.closest("[data-bait]");
  if (r && S.st === "ready") { S.sel = r.dataset.bait; S.focus = "bait-" + r.dataset.bait; render(); return; }
  const p = e.target.closest("[data-plq]");
  if (p) { S.plq = +p.dataset.plq; S.focus = "plq-" + p.dataset.plq; render(); }
});
document.addEventListener("keydown", e => {
  if (S.st === "trophy" && (e.key === "Escape" || e.key === "Backspace")) { e.preventDefault(); act("btn-back"); return; }   // B closes
  if (S.input !== "pad") return;
  const list = focusables(); if (!list.length) return;
  let i = list.findIndex(el => el.dataset.f === S.focus);
  const cur = list[i];
  if (cur && cur.dataset.plq !== undefined) {   // D-pad on the wall: two plaques a row
    const n = +cur.dataset.plq, count = document.querySelectorAll("#zoomer [data-plq]").length;
    let to = null;
    if (e.key === "ArrowLeft" && n % 2 === 1) to = n - 1;
    else if (e.key === "ArrowRight" && n % 2 === 0 && n + 1 < count) to = n + 1;
    else if (e.key === "ArrowUp") to = n - 2 >= 0 ? n - 2 : "mode-" + S.wall;
    else if (e.key === "ArrowDown") to = n + 2 < count ? n + 2 : "btn-back2";
    else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); S.plq = n; render(); return; }
    if (to !== null) { e.preventDefault(); S.focus = typeof to === "number" ? "plq-" + to : to; render(); }
    return;
  }
  if (["ArrowDown", "ArrowRight"].includes(e.key)) i = Math.min(list.length - 1, i + 1);
  else if (["ArrowUp", "ArrowLeft"].includes(e.key)) i = Math.max(0, i - 1);
  else if (e.key === "Enter" || e.key === " ") {
    const el = list[i]; e.preventDefault();
    if (el.dataset.bait) { S.sel = el.dataset.bait; render(); } else if (el.dataset.act) act(el.dataset.act);
    return;
  } else return;
  e.preventDefault(); S.focus = list[i].dataset.f; render();
});
window.addEventListener("resize", fit);

/* ======================================================================
   Notes under the stage: what each state shows, the data, the questions

    nobait: "No bait on the hook and none in the bags. The bait row goes red; the body lists what fish take, in the game's own bait groups and item names, and where to get it: Foraging's Fish Bait category, a Fishing Net, the kitchen. Search for bait (default) opens the Foraging tab with Fish Bait chosen. Cast stays: a bare hook still works, for junk only.",
    log: "After two hours on the bank. This trip's facts on top (landed, junk, got away, heaviest, total, bait used, line wear, species found from the game's own record), then the catch log, kept for the whole game: the newest 20 of 64, today's lines with the time, older days' with the date. Trophy wall sits in the log's header with its count (species mounted).",
    trophy: "The trophy wall, a card pushed over the Fishing tab at the drawer's full width, with the back bar on top (as an item card is). Top 10 ranks the heaviest catches of the whole game, the first three with a gold, silver and bronze tab; Each kind hangs the best of each of the 21 species in the game's order, with empty outlines marked Not caught yet, so it is also the collection (8 of 21). No wall behind them (the director): the plaques hang on the window's own surface. Each plaque is a stained board with the fish in pixel art and a brass plate: the game's catch name, weight, date, place and bait. The wall scrolls as one; the record band under it gives the chosen plaque's full record (A or a click). D-pad moves between plaques, B or Back returns to the tab. The wall's wood stays the same in every theme, as the desk and props do; the chrome follows the theme."
  };
  return `<h2>This state</h2><p>${per[S.st]}</p>
  <h2>How it appears</h2>
  <p>A contextual tab on the World window's strip (the fish, last in the second group, as Radio and Vehicle are): it shows while a fishing rod is in the primary hand or water is within reach. When the line goes out and the World window is open, the tab opens itself (the director's ruling); with the World window shut, nothing opens. The title reads World + Fishing. Everything sits in one scroll; the header strip and the band at the foot are pinned, as on Foraging. Fish abundance stays hidden, as in the game.</p>
  <h2>Director's rulings in v2</h2>
  <ul>
    <li>Bait ratings as the game gives them: from Fishing 6, only for species already caught.</li>
    <li>The catch log is kept for the whole game, newest 20 shown; this trip's summary stays on top in state 5.</li>
    <li>The tab opens itself when the line goes out, if the World window is open.</li>
    <li>Fish abundance stays hidden.</li>
  </ul>
  <h2>The trophy wall: where and how it is kept</h2>
  <ul>
    <li>The keycap sits in the catch log's header, not the foot band: the foot holds the fishing verbs, which change with the state (Cast, Reel in, Search for bait), and the wall belongs with the log. There it stays reachable in every state, line out or not. Its count is the species mounted (8).</li>
    <li>Kept all game, in the player's save (player mod data, beside the game's own record of species caught). On landing a fish, ZeD writes a trophy record when the catch makes the top 10 by weight or beats the best of its species: name as the game gives it, length, weight, date and time, place (the nearest map label and the water), bait, rod and Fishing level. At most 10 + 21 records, so the save stays small.</li>
    <li>Junk and No catch never reach the wall. A catch is recorded when it is landed, even if it is later eaten or dropped.</li>
  </ul>
  <h2>Game data used</h2>
  <ul>
    <li><code>shared/Fishing/fishing_properties.lua</code>: rods, lines, hooks, the bait groups and item lists, the 21 species, junk items, the rod's name with its bait.</li>
    <li><code>shared/Fishing/FishingUtils.lua</code>: size odds and species weight limit per level, near shore, time, temperature and weather effects.</li>
    <li><code>shared/Fishing/FishingRod.lua</code>, <code>Bobber.lua</code>, <code>Fish.lua</code>: tension, line wear past 80%, the hold limit, bait used up, cast spread, catch names, trophies, junk with a bare hook.</li>
    <li><code>client/Fishing/FishingStates.lua</code>: Idle, Cast, Wait, Reel in, Reel out, Pick up fish; <code>client/PZAPI/ui/organisms/FishWindow.lua</code>: the game's Fishing panel and its skill gates; <code>ISInventoryPaneContextMenu.addFishRodOptions</code>: Add Bait, Remove Bait, Change hook, Change line.</li>
    <li>ZeD: <code>ForagingTab.lua</code> and <code>AnimalsTab.lua</code> for the layout, <code>Overrides/Fishing.lua</code> for the rod meter, which stays.</li>
  </ul>
  <h2>Open questions for the director</h2>
  <ol>
    <li>Empty plaques in Each kind: Not caught yet with no name, as the game's own panel hides uncaught species / name the species.</li>
    <li>Mounted fish: wall only, as records / a real placeable trophy item later (taxidermy from a caught fish).</li>
    <li>Top 10: by weight / by length.</li>
  </ol>`;
}
