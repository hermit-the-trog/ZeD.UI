<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeD Identity v2</title>
<!-- The Identity tab, four ways: Immersive (the license) and Simple (ZeD components), the director's two names for every
     surface (Nov 5 2026: "Everything is either immersive or simple"); the weight as big as the name, with + / ++ / - for its trend.
     (Design, Cowork, Nov 5 2026). v2, the director: the narrow card's full body fills the card
     under the header; Simple's avatar on the theme; every colored word on the license in the player's accent (darkened
     for the cream card), wide and narrow, and Simple's labels in it too; a concealed carry permit by profession.
     v1, the director, Nov 5 2026:
     - the license header redrawn in pixel art (tools/identity/ky_header.py), the BRAIN donor kept ("it's a zombie game");
     - the narrow card stays a license, laid out like Tennessee's vertical card (photo with the key fields beside it,
       the name big, small red-labelled rows, the seal and the donor badge at the foot, a security pattern behind);
     - and a Plain style, "no graphic, just ZeD components", wide and narrow.
     License or Plain is a choice in ZeD setup (Look); the width picks wide or narrow as now. Images are the real
     header pieces at whole-number scale; the portraits are crops of QA's captures. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Condensed:wght@400;500;600;700&display=swap');
:root {
  --base: #1a1a1e; --surface-1: #222226; --surface-2: #2a2a2e; --surface-3: #333338;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
  --text: #d4d4d8; --text-secondary: rgba(255,255,255,0.45); --text-heading: rgba(255,255,255,0.65);
  --accent: #3fa59a; --danger: #c44040; --positive: #4a9a5a; --stripe-1: #333338; --stripe-2: #2a2a2e;
  --font-mono: 'Fira Mono', monospace; --font-sans: 'Fira Sans Condensed', sans-serif; --page: #0e0f10;
  /* the license's own fixed palette (IdentityTab.lua's KY table), theme-independent */
  --ky-acc: color-mix(in srgb, var(--accent) 62%, #000); --acc-text: var(--accent); --ky-blue: #1b1c92; --ky-card: #e8e4da; --ky-sky: #8cc3e8; --ky-ink: #1e3250; --ky-red: #b3122e; --ky-lam: #d2cec6;
}
:root[data-theme="light"] { --acc-text: color-mix(in srgb, var(--accent) 70%, #000);
  --base: #e9e7e2; --surface-1: #f2f0eb; --surface-2: #dddad3; --surface-3: #cfcbc2;
  --border: rgba(0,0,0,0.14); --border-strong: rgba(0,0,0,0.30);
  --text: #1d1d1f; --text-secondary: rgba(0,0,0,0.55); --text-heading: rgba(0,0,0,0.70); --stripe-1: #cfcbc2; --stripe-2: #dddad3; --page: #8c8a84;
}
:root[data-theme="hc"] {
  --base: #000; --surface-1: #0a0a0a; --surface-2: #141414; --surface-3: #262626;
  --border: rgba(255,255,255,0.45); --border-strong: rgba(255,255,255,0.85);
  --text: #fff; --text-secondary: rgba(255,255,255,0.80); --text-heading: #fff; --stripe-1: #444; --stripe-2: #111;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { font-family: var(--font-sans); font-size: 15px; }
.review { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: center; padding: 8px 16px;
  font-family: var(--font-mono); font-size: 12px; color: #aaa; background: #000; border-bottom: 1px solid #333; }
.review b { color: #ddd; font-weight: 500; }
.review button { font-family: var(--font-mono); font-size: 12px; background: #1b1b1b; color: #ccc; border: 1px solid #444; padding: 3px 8px; cursor: pointer; }
.review button.on { border-color: #ddd; color: #fff; }
.stage { display: flex; justify-content: center; padding: 18px; gap: 28px; flex-wrap: wrap; align-items: flex-start; }
.zoomer { transform-origin: top left; }
.win { display: flex; flex-direction: column; background: color-mix(in srgb, var(--base) 92%, transparent); border: 1px solid var(--border-strong); }
.titlebar { height: 22px; display: flex; align-items: center; gap: 10px; padding: 0 8px;
  background: repeating-linear-gradient(to bottom, var(--stripe-1) 0 2px, var(--stripe-2) 2px 4px); border-bottom: 1px solid var(--border-strong); }
.close { width: 12px; height: 12px; border: 1px solid var(--border-strong); background: var(--surface-1); }
.titlechip { background: var(--surface-2); padding: 0 8px; font-family: var(--font-mono); font-size: 13px; }
.titlechip .plus { color: var(--text-secondary); margin: 0 6px; }
.body { display: flex; }
.rail { width: 40px; flex: 0 0 40px; border-right: 1px solid var(--border); }
.rail div { height: 40px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }
.rail div.on { background: var(--accent); color: var(--base); font-weight: 700; }
.panel { flex: 1; min-width: 0; }
.panelhead { height: 38px; display: flex; align-items: center; padding: 0 12px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 18px; }
.sec { padding: 6px 12px 4px; background: var(--surface-1); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  font-family: var(--font-mono); font-weight: 700; font-size: 13px; color: var(--text-heading); display: flex; }
.sec .r { margin-left: auto; font-weight: 400; }
.helpband { min-height: 28px; display: flex; align-items: center; padding: 4px 12px; background: var(--surface-2); border-top: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); }
.px { image-rendering: pixelated; display: block; }
.cap { font-family: var(--font-mono); font-size: 11px; color: #888; text-align: center; margin-top: 6px; }

/* ---------- the license: wide */
.lam { margin: 8px; padding: 8px; background: var(--ky-lam); border-radius: 10px; box-shadow: inset 0 0 0 1px rgba(27,28,146,.3); }
.lic { background: var(--ky-card) url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAICAYAAADwdn+XAAAAcElEQVR4nGN88eTW/x8/vjCAwDcmKTDN9e8ZmObg4GEgBFiwaYTxORg+ETbg3S8+BiE2mEIeFI2octgBEz4FIDmQIbgASI6FkBORDUH3IkiOoAHYNML4IC8TNAAUQ7DYQAQqhA+SY4JFISHN2ABIDgAW9TS/mW4OsgAAAABJRU5ErkJggg==) repeat; background-size: 32px 16px; image-rendering: pixelated; color: #1a1a1a; position: relative; overflow: hidden; }
.band { background: var(--ky-blue); height: 48px; position: relative; box-shadow: inset 0 2px 0 #4042be, inset 0 -2px 0 #0d0e5c; }
.band img { position: absolute; top: 0; height: 48px; image-rendering: pixelated; }
.wbody { display: flex; padding: 14px 14px 12px 0; gap: 14px; }
.photo { background: var(--ky-sky); border-radius: 4px; overflow: hidden; position: relative; display: flex; align-items: flex-end; justify-content: center; }
.photo img { image-rendering: auto; }
.wleft { width: 150px; flex: 0 0 150px; display: flex; flex-direction: column; align-items: center; }
.wright { flex: 1; min-width: 0; }
.kname { font-family: var(--font-sans); font-weight: 700; font-size: 18px; color: #121212; display: flex; align-items: center; }
.kname .wt { margin-left: auto; font-size: 13px; font-weight: 500; color: var(--ky-ink); background: rgba(27,28,146,.1); padding: 1px 5px; }
.kgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-top: 10px; }
.kl { font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: var(--ky-acc); }
.kv { font-size: 14px; color: #1a1a1a; font-weight: 500; }
.krule { border-top: 1px solid rgba(27,28,146,.08); grid-column: 1 / -1; }
.seal { opacity: .45; margin-top: 10px; }

/* ---------- the license: narrow (Tennessee's layout) */
.tbody { padding: 10px 12px 12px; position: relative; }
.wm { position: absolute; left: 50%; transform: translateX(-50%); bottom: 64px; width: 224px; image-rendering: pixelated; pointer-events: none; opacity: .9; }
.trow { position: relative; display: flex; gap: 10px; }
.tphoto { width: 44%; flex: 0 0 44%; aspect-ratio: 3 / 4; }
.tside { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.redbox { border: 2px solid var(--ky-acc); color: var(--ky-acc); font-family: var(--font-mono); font-weight: 700; font-size: 12px; text-align: center; padding: 2px 4px; line-height: 1.15; }
.rl { font-family: var(--font-mono); font-size: 10px; font-weight: 700; color: var(--ky-acc); letter-spacing: .02em; }
.rv { font-family: var(--font-mono); font-size: 13px; font-weight: 700; color: #141414; }
.big { font-family: var(--font-sans); font-weight: 700; font-size: 19px; color: #121212; line-height: 1.05; }
.tname { margin-top: 10px; font-family: var(--font-sans); font-weight: 700; font-size: 20px; color: #121212; line-height: 1.05; }
.tname .fore { font-size: 16px; font-weight: 600; }
.tsmall { position: relative; display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 3px 6px; margin-top: 8px; align-items: baseline; }
.tfoot { position: relative; display: flex; align-items: flex-end; justify-content: space-between; margin-top: 8px; }

/* ---------- plain: ZeD's own components */
.pcard { margin: 10px 12px; }
.pwide { display: flex; gap: 14px; }
.pphoto { background: var(--surface-2); border: 1px solid var(--border-strong); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
.pname { font-weight: 600; font-size: 18px; display: flex; align-items: baseline; gap: 8px; }
.pname .wt { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--text-secondary); font-weight: 400; }
.prows { margin-top: 6px; }
.prow { display: flex; padding: 4px 0; font-size: 14px; }
.prow .k { font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--acc-text); }
.prow .v { margin-left: auto; text-align: right; }

/* ---------- traits */
.traits { padding: 8px 12px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; font-size: 14px; }
.traits.one { grid-template-columns: 1fr; }
.traits .t { display: flex; align-items: center; gap: 8px; padding: 3px 0; }
.traits .dot { width: 8px; height: 8px; }
.tlabel { grid-column: 1 / -1; font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: var(--text-heading); margin-top: 4px; }

.permit { background: var(--ky-acc); color: var(--ky-card); font-family: var(--font-mono); font-weight: 700; font-size: 11px; text-align: center; padding: 3px 4px; line-height: 1.15; position: relative; }
.stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(-14deg); border: 3px double var(--ky-acc); color: var(--ky-acc);
  font-family: var(--font-mono); font-weight: 700; font-size: 13px; text-align: center; padding: 3px 8px; line-height: 1.2; background: color-mix(in srgb, var(--ky-card) 55%, transparent); white-space: nowrap; }
.revoked { position: absolute; right: -8px; bottom: -10px; }
.revoked span { display: inline-block; transform: rotate(-12deg); border: 2px solid #b3122e; color: #b3122e; font-size: 10px; padding: 0 4px; background: rgba(232,228,218,.85); }
.photo { cursor: pointer; }
.review .sw { width: 16px; height: 16px; border: 1px solid #555; display: inline-block; cursor: pointer; vertical-align: middle; }
.review .sw.on { outline: 1px solid #fff; outline-offset: 1px; }

.kwt { margin-left: auto; font-family: var(--font-sans); font-weight: 700; font-size: 18px; color: #121212; white-space: nowrap; }
.twt { margin-left: auto; font-family: var(--font-sans); font-weight: 700; font-size: 20px; color: #121212; white-space: nowrap; }
.pwt { margin-left: auto; font-weight: 600; font-size: 18px; color: var(--text); white-space: nowrap; }
.pwt.left { margin-left: 0; }
.trend { margin-left: 3px; color: var(--ky-acc); }
.pwt .trend { color: var(--acc-text); }
</style>
</head>

          <div><div class="kl">Hair color</div><div class="kv">${D.hcol}</div></div><div><div class="kl">Facial hair</div><div class="kv">${D.facial}</div></div><div class="krule"></div>
          <div style="grid-column:1/-1"><div class="kl">Survived For</div><div class="kv">${D.surv}</div></div><div class="krule"></div>
          <div><div class="kl">Favorite Weapon</div><div class="kv">${D.fav}</div></div><div><div class="kl">Zombies Killed</div><div class="kv">${D.kills}</div></div>
        </div></div></div></div></div>`;
}
function licenseNarrow() {
  const head = `<div class="band" style="display:flex;justify-content:center"><img src="${IMG.tall}" style="position:static;width:148px"></div>`;
  if (S.photo === "full") return `<div class="lam" style="margin:8px"><div class="lic">${head}
    <div class="photo" data-photo style="border-radius:0;height:560px">${`<img src="${IMG.full}" style="height:540px">`}</div></div></div>`;
  const p = permit();
  return `<div class="lam" style="margin:8px"><div class="lic">${head}
    <div class="tbody"><img class="wm" src="${IMG.wm}">
      <div class="trow">
        <div class="photo tphoto" data-photo><img src="${IMG.bust}" style="width:100%;height:100%;object-fit:cover"></div>
        <div class="tside">
          <div class="redbox">OPERATOR<br>CLASS D</div>
          ${p ? `<div class="permit">CONCEALED<br>CARRY${p === "revoked" ? `<div class="revoked"><span>REVOKED</span></div>` : ""}</div>` : ""}
          <div style="margin-top:2px"><div class="rl">DL NO</div><div class="rv">${D.dl}</div></div>
          <div><div class="rl">SURVIVED</div><div class="big">${D.surv.replace(", ", "<br>")}</div></div>
          <div><span class="rl">ISS</span> <span class="rv" style="font-size:11px">${D.iss}</span></div>
          <div><span class="rl">EXP</span> <span class="rv" style="font-size:11px">${D.exp}</span></div>
        </div></div>
      <div class="tname" style="display:flex;align-items:flex-start"><span>${esc(D.sur.toUpperCase())}<br><span class="fore">${esc(D.fore.toUpperCase())}</span></span>${wt("twt")}</div>
      <div class="tsmall">
        <span class="rl">SEX</span><span class="rv" style="grid-column:2/-1">${D.sex[0]}</span>
        <span class="rl">HAIR</span><span class="rv">${D.hcol.toUpperCase()}</span><span class="rl">STYLE</span><span class="rv">${D.hstyle.toUpperCase()}</span>
        <span class="rl">FACIAL</span><span class="rv">${D.facial.toUpperCase()}</span><span class="rl">BODY</span><span class="rv">${D.body.toUpperCase()}</span>
        <span class="rl">PROF</span><span class="rv" style="grid-column:2/-1">${S.prof.toUpperCase()}</span>
        <span class="rl">KILLS</span><span class="rv" style="grid-column:2/-1">${D.kills}</span>
        <span class="rl">FAV</span><span class="rv" style="grid-column:2/-1">${D.fav.toUpperCase()}</span>
      </div>
      <div class="tfoot"><img src="${IMG.seal}" style="width:56px;opacity:.4"><img class="px" src="${IMG.donor}" style="width:${32 * 3}px"></div>
    </div></div></div>`;
}
function rows() {
  return [["Sex", D.sex], ["Profession", S.prof], ["Hair style", D.hstyle], ["Hair color", D.hcol], ["Facial hair", D.facial], ["Body hair", D.body],
    ["Survived for", D.surv], ["Favorite weapon", D.fav], ["Zombies killed", D.kills]]
    .concat(permit() ? [["Carry permit", permit() === "revoked" ? "Revoked" : "Concealed carry"]] : [])
    .map(([k, v]) => `<div class="prow"><span class="k">${k}</span><span class="v">${v}</span></div>`).join("");
}
function plainWide() {
  const ph = S.photo === "bust" ? `<div class="pphoto" data-photo style="width:120px;height:120px;flex:0 0 120px;cursor:pointer">${photoImg(120, true)}</div>` : `<div class="pphoto" data-photo style="width:120px;height:230px;flex:0 0 120px;cursor:pointer">${photoImg(230, true)}</div>`;
  return `<div class="pcard pwide">${ph}<div style="flex:1;min-width:0">
      <div class="pname">${esc(D.fore)} ${esc(D.sur)}${wt("pwt")}</div>
      <div class="prows">${rows()}</div></div></div>`;
}
function plainNarrow() {
  if (S.photo === "full") return `<div class="pcard"><div class="pphoto" data-photo style="width:100%;height:420px;cursor:pointer">${photoImg(400, true)}</div>
    <div class="pname" style="margin-top:8px">${esc(D.fore)} ${esc(D.sur)}${wt("pwt")}</div><div class="prows">${rows()}</div></div>`;
  return `<div class="pcard"><div style="display:flex;gap:12px;align-items:flex-end"><div class="pphoto" data-photo style="width:88px;height:88px;flex:0 0 88px;cursor:pointer">${photoImg(88, true)}</div>
    <div style="flex:1;min-width:0"><div class="pname">${esc(D.fore)} ${esc(D.sur)}</div><div class="pname">${wt("pwt left")}<span class="wt" style="margin-left:auto;white-space:nowrap">${S.prof}</span></div></div></div>
    <div class="prows" style="margin-top:8px">${rows()}</div></div>`;
}
function traits(one) {
  const t = (n, c) => `<div class="t"><span class="dot" style="background:${c}"></span>${n}</div>`;
  return `<div class="sec">Traits<span class="r">10</span></div><div class="traits ${one ? "one" : ""}">
    <div class="tlabel">Positive (5)</div>${D.pos.map(n => t(n, "var(--positive)")).join("")}
    <div class="tlabel">Negative (5)</div>${D.neg.map(n => t(n, "var(--danger)")).join("")}</div>`;
}
function win(width, narrow) {
  const card = S.style === "license" ? (narrow ? licenseNarrow() : licenseWide()) : (narrow ? plainNarrow() : plainWide());
  return `<div><div class="zoomer" style="transform:scale(${S.zoom});width:${width}px;margin-right:${(S.zoom - 1) * width}px"><div class="win" style="width:${width}px">
    <div class="titlebar"><div class="close"></div><div class="titlechip">Angel Cross <span class="plus">+</span> Identity</div></div>
    <div class="body"><div class="rail">${["INV", "EQP", "HP", "TMP", "CK", "ID", "SK"].map(r => `<div class="${r === "ID" ? "on" : ""}">${r}</div>`).join("")}</div>
      <div class="panel"><div class="panelhead">Identity</div>${card}${traits(narrow)}
        <div class="helpband">${S.photo === "full" ? "Pick the photo again for the card." : "Pick the photo for the full body."}</div></div></div></div></div>
    <div class="cap">${S.style === "license" ? "Immersive" : "Simple"}, ${narrow ? "narrow" : "wide"} (${width}px window at 1x)</div></div>`;
}
function render() {
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.style.setProperty("--accent", S.accent);
  review();
  const out = [];
  if (S.width !== "narrow") out.push(win(560, false));
  if (S.width !== "wide") out.push(win(330, true));
  document.getElementById("stage").innerHTML = out.join("");
}
document.addEventListener("click", e => {
  if (e.target.closest("[data-photo]")) { S.photo = S.photo === "bust" ? "full" : "bust"; render(); return; }
  const r = e.target.closest("[data-r]"); if (!r) return; const [k, v] = r.dataset.r.split(/:(.*)/); S[k] = k === "zoom" ? +v : v; render(); });
render();
</script>
</body>
</html>
