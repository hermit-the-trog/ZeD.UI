<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeD Lua Console</title>
<!-- ZeD-GUI mockup: the bigger Lua console, punch list 136 (phases 1-4), v1.
     Rulings: debug mode only (no guarded mode for normal players); the server command list is in.
     Source: docs/reference/RESEARCH_console_tooling_20261108.md. Starting point: the shipped ZeD_DebugConsole.lua
     (beta 8/9: the game's console parked as the engine, its output box as one list with errors picked whole, the
     line with ">" and Tab suggestion, the band Copy / Clear / Run, the controller zones list / line / band, B closes).
     Chrome, tokens, review bar, keycaps, pad badges and the pointing hand copied from zed_tab_search_v1.html and
     zed_journal_tags_v1.html. Log lines are the shapes 42.22 writes (ExceptionLogger, "function: X -- file: Y line # N
     | MOD: Z", "Callframe at:", "| Vanilla"); server commands from the 42.x registry as the research lists them
     (syntax to be checked in Phase 0 against /help on a 42.22 server).
     Units: 1 CSS px here = 1 ZeD unit; the game draws 1 unit as 1.75 screen pixels at 4K and 0.75 at the Deck. -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500;700&family=Fira+Sans+Condensed:wght@400;500;600;700&display=swap');
:root {
  --base: #1a1a1e; --surface-1: #222226; --surface-2: #2a2a2e; --surface-3: #333338;
  --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.20);
  --text: #d4d4d8; --text-secondary: rgba(255,255,255,0.45); --text-heading: rgba(255,255,255,0.65);
  --accent: #47a18c; --acc-text: var(--accent); --on-accent: #0c0c0c;
  --danger: #c44040; --warning: #c49040; --positive: #4a9a5a;
  --stripe-1: #333338; --stripe-2: #2a2a2e;
  --font-mono: 'Fira Mono', monospace; --font-sans: 'Fira Sans Condensed', sans-serif;
  --page: #0e0f10; --ground: #3a3f2c;
}
:root[data-theme="light"] { --acc-text: color-mix(in srgb, var(--accent) 70%, #000); --on-accent: #fff;
  --base: #e9e7e2; --surface-1: #f2f0eb; --surface-2: #dddad3; --surface-3: #cfcbc2;
  --border: rgba(0,0,0,0.14); --border-strong: rgba(0,0,0,0.30);
  --text: #1d1d1f; --text-secondary: rgba(0,0,0,0.55); --text-heading: rgba(0,0,0,0.70);
  --stripe-1: #cfcbc2; --stripe-2: #dddad3; --page: #8c8a84; --ground: #7d8068;
  --danger: #a83030; --warning: #8a6420; --positive: #3a7a48;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--page); color: var(--text); }
body { font-family: var(--font-sans); font-size: 15px; }

/* ---------- review bar (mockup only, not game UI) */
.review { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; justify-content: center; padding: 8px 16px;
  font-family: var(--font-mono); font-size: 12px; color: #aaa; background: #000; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 5; }
.review b { color: #ddd; font-weight: 500; margin-right: 4px; }
.review button { font-family: var(--font-mono); font-size: 12px; background: #1b1b1b; color: #ccc; border: 1px solid #444; padding: 3px 8px; cursor: pointer; }
.review button.on { border-color: #ddd; color: #fff; }
.review .grp { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.stage { display: flex; justify-content: center; padding: 16px; overflow: hidden; }
.zoomer { transform-origin: top left; }
.notes { max-width: 980px; margin: 0 auto; padding: 4px 16px 48px; color: #c8c8c8; font-size: 15px; line-height: 1.45; }
.notes h2 { font: 700 12px/1 var(--font-mono); text-transform: uppercase; color: #8fc9b9; margin: 22px 0 8px; }
.notes h3 { font: 500 13px/1 var(--font-mono); color: #ddd; margin: 14px 0 6px; }
.notes p { margin: 0 0 8px; max-width: 84ch; }
.notes ol, .notes ul { margin: 0 0 8px; padding-left: 20px; max-width: 86ch; }
.notes li { margin-bottom: 4px; }
.notes code { font-family: var(--font-mono); font-size: 13px; color: #e0e0e0; }
.notes .rec { color: #8fc9b9; }

.scene { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px; background: var(--ground); }
.deck { width: 1707px; height: 1067px; position: relative; background: var(--ground); display: flex; align-items: center; justify-content: center; border: 1px solid #000; }
.deck .lab { position: absolute; left: 12px; top: 8px; font: 400 12px/1 var(--font-mono); color: rgba(255,255,255,0.55); }

/* ---------- ZeD window chrome */
.win { display: flex; flex-direction: column; background: color-mix(in srgb, var(--base) 92%, transparent); border: 1px solid var(--border-strong); }
.titlebar { height: 22px; flex: 0 0 22px; display: flex; align-items: center; gap: 10px; padding: 0 8px; position: relative;
  background: repeating-linear-gradient(to bottom, var(--stripe-1) 0 2px, var(--stripe-2) 2px 4px); border-bottom: 1px solid var(--border-strong); }
.close { width: 12px; height: 12px; border: 1px solid var(--border-strong); background: var(--surface-1); flex: 0 0 12px; }
.titlechip { position: absolute; left: 50%; transform: translateX(-50%); background: var(--surface-2); padding: 0 8px; font-family: var(--font-mono); font-size: 13px; line-height: 22px; color: var(--acc-text); white-space: nowrap; }
.titlechip .plus { color: var(--text-secondary); margin: 0 6px; }
.titlebar .rt { margin-left: auto; background: var(--surface-2); padding: 0 6px; font: 400 12px/22px var(--font-mono); color: var(--text-secondary); display: inline-flex; align-items: center; gap: 5px; }
.wbody { display: flex; min-height: 0; flex: 1; }
.strip { width: 34px; flex: 0 0 34px; display: flex; flex-direction: column; align-items: stretch; padding-top: 2px; border-right: 1px solid var(--border); }
.strip .t { position: relative; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); cursor: pointer; }
.strip .t.on { background: var(--accent); color: var(--on-accent); }
.page { flex: 1; min-width: 0; display: flex; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }

/* fold headers: "v NAME (n)" */
.fold { position: relative; display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; font: 700 12px/1 var(--font-mono); color: var(--text-heading); cursor: pointer; white-space: nowrap; }
.fold .n { font-weight: 400; color: var(--text-secondary); }
.fold .r { margin-left: auto; font-weight: 400; color: var(--text-secondary); }
.tri { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--text-heading); display: inline-block; flex: 0 0 auto; }
.tri.r { border-top: 4px solid transparent; border-bottom: 4px solid transparent; border-left: 5px solid var(--text-heading); border-right: 0; }

/* the filter column */
.filters { width: 168px; flex: 0 0 168px; border-right: 1px solid var(--border); }
.filters .scroll { padding: 4px 0 8px; }
.cbr { position: relative; display: flex; align-items: center; gap: 6px; height: 20px; padding: 0 8px 0 20px; font: 400 12px/1 var(--font-mono); color: var(--text); cursor: pointer; white-space: nowrap; }
.cbr .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cbr .c { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.cbr.off .nm { color: var(--text-secondary); }
.box { width: 11px; height: 11px; flex: 0 0 11px; border: 1px solid var(--border-strong); background: var(--surface-1); display: inline-flex; align-items: center; justify-content: center; }
.sq { width: 7px; height: 7px; flex: 0 0 7px; display: inline-block; }
.groove { height: 1px; background: var(--border); margin: 6px 8px; }

/* Find field with the magnifier */
.lhead { height: 34px; flex: 0 0 34px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-bottom: 1px solid var(--border); }
.field { position: relative; flex: 1; min-width: 0; height: 24px; display: flex; align-items: center; gap: 6px; background: var(--base); border: 1px solid var(--border-strong); padding: 0 6px; }
.field.focus { border-color: var(--accent); }
.field input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 14px/22px var(--font-sans); padding: 0; }
.field input::placeholder { color: var(--text-secondary); }
.field .clr { width: 14px; height: 14px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-secondary); font: 700 10px/12px var(--font-mono); text-align: center; cursor: pointer; flex: 0 0 14px; }
.fcount { font: 400 12px/1 var(--font-mono); color: var(--text-secondary); white-space: nowrap; font-variant-numeric: tabular-nums; }
.fcount b { color: var(--acc-text); font-weight: 400; }
.popup { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 6px; background: var(--surface-1); border: 1px solid var(--border-strong); font: 400 12px/1 var(--font-mono); white-space: nowrap; cursor: pointer; }
.popup::after { content: ""; border-left: 3px solid transparent; border-right: 3px solid transparent; border-top: 4px solid var(--text-secondary); margin-left: 8px; }

/* the log list */
.list { font: 400 12px/18px var(--font-mono); padding: 2px 0 6px; }
.lr { position: relative; display: flex; align-items: flex-start; gap: 8px; padding: 0 8px; min-height: 18px; cursor: default; }
.lr:hover { background: color-mix(in srgb, var(--surface-2) 80%, transparent); }
.lr .tm { width: 56px; flex: 0 0 56px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.lr .kd { width: 62px; flex: 0 0 62px; display: inline-flex; align-items: center; gap: 5px; height: 18px; color: var(--text-secondary); }
.lr .ms { flex: 1; min-width: 0; color: var(--text); white-space: pre-wrap; word-break: break-word; display: flex; gap: 6px; }
.lr .ms .tri { margin-top: 6px; }
.lr .ms .tri.r { margin-top: 5px; }
.lr .src { flex: 0 0 auto; max-width: 230px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
.lr .rp { width: 34px; flex: 0 0 34px; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
.lr.sel, .stk.sel { background: var(--accent); }
.lr.sel *, .stk.sel * { color: var(--on-accent) !important; }
.lr.sel .tri { border-top-color: var(--on-accent); } .lr.sel .tri.r { border-left-color: var(--on-accent); border-top-color: transparent; }
.lr.sel .sq { outline: 1px solid var(--on-accent); }
.lr.ran .ms { color: var(--acc-text); }
.stk { padding: 0 8px 4px 148px; font: 400 11px/16px var(--font-mono); color: var(--text-secondary); white-space: pre-wrap; word-break: break-word; }
.stk .fn { color: var(--text); }
.stk .md { color: var(--text-heading); }
.hit { color: var(--acc-text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.lr.sel .hit { color: var(--on-accent); }
.empty { padding: 14px 12px 10px; font: 400 14px/1.4 var(--font-sans); }
.empty .sub { display: block; color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
.empty .acts { margin-top: 10px; display: flex; gap: 8px; }

/* the line and the scratchpad */
.inarea { position: relative; flex: 0 0 auto; border-top: 1px solid var(--border); padding: 6px 8px 8px; }
.line { position: relative; display: flex; align-items: center; gap: 8px; }
.lfield { position: relative; flex: 1; min-width: 0; height: 26px; display: flex; align-items: center; gap: 6px; background: var(--surface-1); border: 1px solid var(--border-strong); padding: 0 6px; }
.lfield.focus { border-color: var(--accent); }
.lfield .pm { font: 400 13px/1 var(--font-mono); color: var(--text-secondary); }
.lfield input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font: 400 13px/24px var(--font-mono); padding: 0; }
.lfield input::placeholder { color: var(--text-secondary); }
.lfield .len { font: 400 11px/1 var(--font-mono); color: var(--text-secondary); font-variant-numeric: tabular-nums; }
.padrow { display: flex; gap: 8px; min-height: 0; }
.pbox { position: relative; flex: 1; min-width: 0; display: flex; background: var(--surface-1); border: 1px solid var(--border-strong); }
.pbox.focus { border-color: var(--accent); }
.pbox .gut { flex: 0 0 26px; padding: 4px 4px 4px 0; text-align: right; font: 400 13px/18px var(--font-mono); color: var(--text-secondary); border-right: 1px solid var(--border); user-select: none; white-space: pre; }
.pbox textarea { flex: 1; min-width: 0; height: 134px; border: 0; outline: 0; resize: none; background: transparent; color: var(--text); font: 400 13px/18px var(--font-mono); padding: 4px 6px; white-space: pre; overflow: auto; tab-size: 2; }
.pbox.off textarea, .pbox.off .gut { opacity: .4; }
.pmeta { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font: 400 11px/1 var(--font-mono); color: var(--text-secondary); white-space: nowrap; }
.pmeta .r { margin-left: auto; display: flex; gap: 6px; }
.side { width: 196px; flex: 0 0 196px; border: 1px solid var(--border); background: color-mix(in srgb, var(--surface-1) 60%, transparent); display: flex; flex-direction: column; min-height: 0; max-height: 156px; }
.side .scroll { padding: 2px 0 4px; }
.snip { position: relative; display: flex; align-items: center; gap: 6px; height: 19px; padding: 0 8px 0 20px; font: 400 13px/1 var(--font-sans); cursor: pointer; white-space: nowrap; }
.snip .c { margin-left: auto; font: 400 11px/1 var(--font-mono); color: var(--text-secondary); }
.snip.h { font: 400 11px/1 var(--font-mono); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; display: block; line-height: 19px; }
.snip.sel { background: var(--accent); color: var(--on-accent); } .snip.sel .c { color: var(--on-accent); }
.notice { display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px; margin-bottom: 6px; background: var(--surface-2); border: 1px solid var(--border-strong); font: 400 13px/1.35 var(--font-sans); }
.notice .sq { margin-top: 5px; }
.notice b { font-weight: 600; }

/* the autocomplete pull-down (a ZeD menu) */
.ac { position: absolute; z-index: 6; min-width: 300px; max-width: 460px; background: var(--surface-1); border: 1px solid var(--border-strong); font: 400 12px/1 var(--font-mono); }
.ac .it { position: relative; display: flex; align-items: center; gap: 8px; height: 20px; padding: 0 8px; white-space: nowrap; cursor: pointer; }
.ac .it .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.ac .it .nm b { font-weight: 700; }
.ac .it .sg { color: var(--text-secondary); }
.ac .it .kd { display: inline-flex; align-items: center; gap: 5px; color: var(--text-secondary); width: 92px; }
.ac .it.sel { background: var(--accent); color: var(--on-accent); } .ac .it.sel * { color: var(--on-accent); }
.ac .ft { border-top: 1px solid var(--border); padding: 4px 8px; color: var(--text-secondary); font-size: 11px; line-height: 14px; white-space: normal; }

/* the command list */
.cr { position: relative; display: flex; align-items: center; gap: 10px; height: 22px; padding: 0 10px 0 22px; cursor: pointer; white-space: nowrap; }
.cr .cm { width: 168px; flex: 0 0 168px; font: 400 12px/1 var(--font-mono); overflow: hidden; text-overflow: ellipsis; }
.cr .ds { flex: 1; min-width: 0; font: 400 14px/1 var(--font-sans); overflow: hidden; text-overflow: ellipsis; }
.cr .ac2 { width: 96px; flex: 0 0 96px; display: inline-flex; align-items: center; gap: 5px; font: 400 11px/1 var(--font-mono); color: var(--text-secondary); }
.cr .sp { width: 200px; flex: 0 0 200px; font: 400 11px/1 var(--font-mono); color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; }
.cr.sel { background: var(--accent); color: var(--on-accent); } .cr.sel * { color: var(--on-accent) !important; }
.cr.dim { opacity: .4; }
.detail { flex: 0 0 auto; border-top: 1px solid var(--border); padding: 8px 12px 8px; display: grid; grid-template-columns: 116px 1fr; gap: 3px 10px; align-items: baseline; }
.detail dt { font: 400 12px/18px var(--font-mono); color: var(--text-secondary); }
.detail dd { margin: 0; font: 400 14px/18px var(--font-sans); }
.detail dd.code { font: 400 12px/18px var(--font-mono); }
.detail .hd { grid-column: 1 / 3; font: 700 13px/18px var(--font-mono); color: var(--text); display: flex; align-items: center; gap: 8px; }
.detail .tg { display: inline-flex; align-items: center; gap: 5px; font: 400 11px/1 var(--font-mono); color: var(--text-secondary); }

/* help page */
.help { padding: 6px 0 10px; }
.hp { padding: 2px 14px 6px 24px; font: 400 14px/1.4 var(--font-sans); max-width: 72ch; }
.kt { display: grid; grid-template-columns: 170px 1fr; gap: 2px 12px; padding: 2px 14px 8px 24px; }
.kt dt { font: 400 12px/20px var(--font-mono); color: var(--text); }
.kt dd { margin: 0; font: 400 14px/20px var(--font-sans); }

.foot { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 5px 10px; background: var(--surface-2); border-top: 1px solid var(--border-strong); min-height: 34px;
  font: 400 12px/1.3 var(--font-mono); color: var(--text-secondary); }
.foot .hint { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.foot .hint.ok { color: var(--text); }
.foot .pr { display: flex; gap: 10px; }
.foot .pr span { display: inline-flex; align-items: center; gap: 4px; color: var(--text); }
.foot .pr span.badge { color: var(--base); }
.foot .bts { display: flex; gap: 8px; }
.btn { position: relative; padding: 4px 12px; border: 1px solid var(--border-strong); border-radius: 4px; background: var(--surface-2); color: var(--text);
  font: 400 13px/16px var(--font-mono); cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.btn::before { content: ""; position: absolute; inset: 2px; border: 1px solid var(--border-strong); border-radius: 2px; pointer-events: none; }
.btn.default, .btn.default::before { border-color: var(--accent); } .btn.default { color: var(--acc-text); }
.btn.danger, .btn.danger::before { border-color: var(--danger); } .btn.danger { color: var(--danger); }
.btn.sm { padding: 1px 9px; font-size: 12px; line-height: 15px; }
.btn.off { opacity: .4; cursor: default; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 16px; height: 14px; padding: 0 3px; background: var(--text); color: var(--base); font: 700 10px/14px var(--font-mono); border-radius: 2px; }

.hand { position: absolute; left: -15px; top: 50%; transform: translateY(-50%); pointer-events: none; z-index: 7; }
.btn.pf { margin-left: 14px; }
.cbr.pf > .hand, .fold.pf > .hand, .snip.pf > .hand, .cr.pf > .hand { left: 2px; }
.fold.pf { padding-left: 20px; }
.lr.pf { padding-left: 22px; } .lr.pf > .hand { left: 3px; top: 9px; }
.strip .t.pf > .hand { left: 1px; }
.field.pf, .lfield.pf, .pbox.pf, .popup.pf { margin-left: 16px; }
.pbox.pf > .hand { top: 14px; }
.px { image-rendering: pixelated; shape-rendering: crispEdges; display: block; }
</style>
</head>
<body>
<div class="review" id="review"></div>
<div class="stage" id="stage"><div class="zoomer" id="zoomer"></div></div>
<div class="notes" id="notes"></div>

<script>
/* ======================================================================
   Pixel icons (10 x 10 unless noted): the page strip, the magnifier, the pointing hand
   ====================================================================== */
const PAL = { "#": "#111", W: "#f4f4f4", x: "currentColor" };
const ICON = {
  tLog:  ["..........","xxxxxxxxxx","..........","xxxxxx....","..........","xxxxxxxx..","..........","xxxx......","..........","xxxxxxx..."],
  tCmd:  ["..........","........x.",".......x..","......x...",".....x....","....x.....","...x......","..x.......",".x........",".........."],
  tHelp: ["...xxxx...","..x....x..","..x....x..",".......x..","......x...",".....x....",".....x....","..........",".....x....",".........."],
  mag:   ["..xxxx....",".x....x...","x......x..","x......x..","x......x..","x......x..",".x....x...","..xxxxxx..","......xxx.",".......xxx"],
  hand:  ["....##########.","...#WWWWWWWWWW#","##.#WWW########","#W#WWWW#WWWW#..","#W#WWWW#####...","#W#WWWW#WWWW#..","#W#WWWW#####...","#W#WWWWWWWW#...","##.#WWWWWWW#...","....#######...."]
};
function px(name, scale) {
  const m = ICON[name]; const h = m.length, w = m[0].length; let r = "";
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const ch = m[y][x]; if (ch === ".") continue; r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${PAL[ch]}"/>`; }
  return `<svg class="px" width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}" aria-hidden="true">${r}</svg>`;
}
const XMARK = `<svg width="9" height="9" viewBox="0 0 9 9" class="px"><path d="M1 1L8 8M8 1L1 8" stroke="var(--acc-text)" stroke-width="1.6"/></svg>`;
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* ======================================================================
   The log: the game's box (prints, the console's own lines) and the F11 error list, as 42.22 writes them.
   k: print | warning | error. mod: the "| MOD:" name (Vanilla shows as Game), Console for your own runs.
   ====================================================================== */
const KINDS = [["print", "Print", "var(--text-secondary)"], ["warning", "Warning", "var(--warning)"], ["error", "Error", "var(--danger)"]];
const KCOL = { print: "var(--text-secondary)", warning: "var(--warning)", error: "var(--danger)", ran: "var(--accent)" };
let LOG = [

/* ======================================================================
   Log filtering
   ====================================================================== */
const srcOf = e => e.file ? (e.ln ? `${e.file}:${e.ln}` : e.file) : "";
const modOn = m => S.mods[m] !== 0, fileOn = f => S.files[f || "(no file)"] !== 0;
function textHit(e, q) { if (!q) return true; q = q.toLowerCase(); return (e.msg + " " + e.mod + " " + srcOf(e) + " " + (e.stack || []).join(" ")).toLowerCase().includes(q); }
function shownLog() { return LOG.filter(e => S.kinds[e.k] && modOn(e.mod) && fileOn(e.file) && textHit(e, S.q)); }
function mark(s, q) {
  if (!q) return esc(s); const i = s.toLowerCase().indexOf(q.toLowerCase()); if (i < 0) return esc(s);
  return esc(s.slice(0, i)) + `<span class="hit">${esc(s.slice(i, i + q.length))}</span>` + esc(s.slice(i + q.length));
}
const f = id => `data-f="${id}"`;
const badge = g => S.input === "pad" && g ? `<span class="badge">${g}</span>` : "";
const sq = c => `<span class="sq" style="background:${c}"></span>`;
const fold = (key, name, n, extra = "") => `<div class="fold" data-fold="${key}" ${f("fold-" + key)}><span class="tri ${S.fold[key] ? "r" : ""}"></span>${name} <span class="n">(${n})</span>${extra}</div>`;

function filterCol() {
  const base = LOG.filter(e => textHit(e, S.q));
  const cnt = (pred) => base.filter(pred).length;
  const mods = [...new Set(LOG.map(e => e.mod))];
  const files = [...new Set(LOG.map(e => e.file || "(no file)"))];
  const cb = (kind, key, label, on, n, col) => `<div class="cbr ${on ? "" : "off"}" data-cb="${kind}:${esc(key)}" ${f("cb-" + kind + "-" + key)}>
     <span class="box">${on ? XMARK : ""}</span>${col ? sq(col) : ""}<span class="nm">${esc(label)}</span><span class="c">${n}</span></div>`;
  let h = fold("kind", "KIND", KINDS.length);
  if (!S.fold.kind) h += KINDS.map(([k, l, c]) => cb("k", k, l, S.kinds[k], cnt(e => e.k === k), c)).join("");
  h += `<div class="groove"></div>` + fold("mod", "MOD", mods.length);
  if (!S.fold.mod) h += mods.map(m => cb("m", m, m, modOn(m), cnt(e => e.mod === m))).join("");
  h += `<div class="groove"></div>` + fold("file", "FILE", files.length);
  if (!S.fold.file) h += files.map(fl => cb("f", fl, fl, S.files[fl] !== 0, cnt(e => (e.file || "(no file)") === fl))).join("");
  return `<div class="col filters"><div class="scroll">${h}</div></div>`;
}

function logList() {
  const rows = shownLog();
  if (!rows.length) return `<div class="empty">Nothing in the log matches${S.q ? ` "${esc(S.q)}"` : ""}.<span class="sub">The search looks at the message, the mod, the file and every line of an error's stack. Some kinds, mods or files are switched off on the left.</span>
    <div class="acts"><button class="btn sm default" data-act="showall" ${f("showall")}>Show all</button></div></div>`;
  return rows.map(e => {
    const isErr = e.k === "error", open = !!S.open[e.id], sel = S.pick === e.id;
    const tag = e.ran ? `${sq(KCOL.ran)}ran` : `${sq(KCOL[e.k])}${e.k === "warning" ? "warn" : e.k}`;
    const tri = isErr ? `<span class="tri ${open ? "" : "r"}"></span>` : "";
    const src = e.mod === "Console" ? "Console" : `${e.mod}${srcOf(e) ? " | " + srcOf(e) : ""}`;
    let h = `<div class="lr ${sel ? "sel" : ""} ${e.ran ? "ran" : ""}" data-row="${e.id}" ${f("row-" + e.id)}>

function tokenAt(text, pos) {
  const before = text.slice(0, pos);
  const m = before.match(/[A-Za-z_][\w]*(?:\(\))?(?:[.:][A-Za-z_]?\w*(?:\(\))?)*$/);
  if (!m) return null;
  const tok = m[0], sep = Math.max(tok.lastIndexOf("."), tok.lastIndexOf(":"));
  if (sep < 0) return tok.length >= 2 ? { start: pos - tok.length, base: null, pre: tok } : null;
  return { start: pos - tok.length + sep + 1, base: tok.slice(0, sep), sepc: tok[sep], pre: tok.slice(sep + 1) };
}
function acFor(which, pos) {
  const text = which === "line" ? S.line : S.pad;
  const t = tokenAt(text, pos); S.ac = null; S.acI = 0;
  if (!t) return;
  let items = [];
  const pl = t.pre.toLowerCase();
  if (!t.base) items = GLOBALS.filter(g => g[0].toLowerCase().startsWith(pl) && g[0] !== t.pre).map(g => ({ n: g[0], k: g[1], s: g[2] }));
  else if (JAVA[t.base] && t.sepc === ":") items = JAVA[t.base].filter(g => g[0].toLowerCase().startsWith(pl)).map(g => ({ n: g[0], k: "Java", s: g[1] }));
  else if (FIELDS[t.base] && t.sepc === ".") items = FIELDS[t.base].filter(g => g[0].toLowerCase().startsWith(pl)).map(g => ({ n: g[0], k: g[1], s: g[2] }));
  if (!items.length) return;
  S.ac = { which, start: t.start, end: pos, pre: t.pre, items: items.slice(0, 9), more: Math.max(0, items.length - 9), java: !!(t.base && JAVA[t.base]), base: t.base };
}
function acTake() {
  const a = S.ac; if (!a) return; const it = a.items[S.acI];
  const fn = it.k === "function" || it.k === "Java";
  const ins = it.n + (fn ? "(" + (it.s === "()" ? ")" : "") : "");
  if (a.which === "line") { S.line = S.line.slice(0, a.start) + ins + S.line.slice(a.end); caret = a.start + ins.length; }
  else { S.pad = S.pad.slice(0, a.start) + ins + S.pad.slice(a.end); caret = a.start + ins.length; }

}

     <span class="kd">${sq(it.k === "Java" ? "var(--warning)" : it.k === "table" ? "var(--accent)" : "var(--text-secondary)")}${it.k === "Java" ? "Java" : it.k}</span></div>`).join("");

/* ======================================================================

   ====================================================================== */
function now() { const d = new Date(); return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":"); }
function addLog(e) { e.id = LOG.length; e.t = now(); LOG.push(e); }
function run(code) {

  const multi = code.includes("\n");

  HIST.push(code); S.hi = null;
  const first = code.split("\n")[0];
  addLog({ k: "print", mod: "Console", file: "console", ran: 1, msg: "> " + first + (multi ? `  (+${code.split("\n").length - 1} lines)` : "") });
  const open = (code.match(/\(/g) || []).length, close = (code.match(/\)/g) || []).length;
  const ends = (code.match(/\b(do|then|function)\b/g) || []).length, endc = (code.match(/\bend\b/g) || []).length;
  if (open !== close || ends < endc) { addLog({ k: "error", mod: "Console", file: "console", ln: 1, msg: `console:${code.split("\n").length}: ${open > close ? "')' expected near <eof>" : "'<eof>' expected near 'end'"}`, stack: ["(a line that does not compile)"] }); }
  else if (ends > endc) { addLog({ k: "error", mod: "Console", file: "console", ln: 1, msg: `console:${code.split("\n").length}: 'end' expected near <eof>`, stack: ["(a block left open)"] }); }
  else if (/getActivatedMods/.test(code)) ["ZeD_UI", "Bandits", "Ladders"].forEach(m => addLog({ k: "print", mod: "Console", file: "console", msg: m }));
  else if (/print\(getPlayer\(\):getX\(\), getPlayer/.test(code)) addLog({ k: "print", mod: "Console", file: "console", msg: "925.4931   13040.217   0" });
  else if (/getLuaDebuggerErrorCount/.test(code)) addLog({ k: "print", mod: "Console", file: "console", msg: String(LOG.filter(e => e.k === "error" && e.mod !== "Console").length) });
  else if (/getX\(\)/.test(code)) addLog({ k: "print", mod: "Console", file: "console", msg: "925.4931" });
  else if (/getHour/.test(code)) addLog({ k: "print", mod: "Console", file: "console", msg: "14" });
  else { const m = code.match(/print\(\s*"([^"]*)"\s*\)/); if (m) addLog({ k: "print", mod: "Console", file: "console", msg: m[1] }); else { const p = code.match(/print\((.*)\)/); if (p) addLog({ k: "print", mod: "Console", file: "console", msg: "nil" }); } }
  if (S.mode === "line") S.line = ""; else S.pad = "";
  S.kinds.print = 1; S.mods.Console = 1; S.hint = null; scrollToEnd = true;
}

/* ======================================================================
   Input
   ====================================================================== */
function act(a, el) {
  S.hint = null;
  if (a === "run") { if (S.mode === "line") run(S.line); else run(S.pad); typing = S.mode === "line" ? "line" : "pad"; S.ac = null; }
  else if (a === "topad") { S.mode = "pad"; S.pad = S.pad || S.line; S.line = ""; S.ac = null; typing = "pad"; }
  else if (a === "toline") { S.mode = "line"; S.line = S.line || (S.pad.includes("\n") ? "" : S.pad); S.ac = null; typing = "line"; }
  else if (a === "save") S.hint = `Saved as snippet ${SNIPS.length + 1} in Zomboid/Lua/ZeD_console_snippets.txt (name it there or with a right-click).`;
  else if (a === "export") { const d = new Date(); const n = `ZeD_console_${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}_${now().slice(0, 5).replace(":", "")}.log`;
    S.hint = `Saved ${shownLog().length} lines (what the filters show) to Zomboid/Lua/${n}`; }
  else if (a === "copy") S.hint = S.pick != null ? "Copied the error, stack and all." : `Copied ${shownLog().length} lines.`;
  else if (a === "clear") { LOG = []; S.open = {}; S.pick = null; S.hint = "Cleared, as the game's own clear does. Errors stay in the F11 list."; }
  else if (a === "clearq") { S.q = ""; typing = "q"; }
  else if (a === "clearcq") { S.cq = ""; typing = "cq"; }
  else if (a === "showall") { S.q = ""; S.kinds = { print: 1, warning: 1, error: 1 }; S.mods = {}; S.files = {}; }
  else if (a === "typeq") typing = "q"; else if (a === "typecq") typing = "cq"; else if (a === "typeline") typing = "line"; else if (a === "typepad") typing = "pad";
  else if (a === "send") { const c = CMDS.find(x => x.cmd === S.csel); S.hint = c && c.destr ? `Send ${c.cmd}? It can't be undone. Press Send again to send it.` : `Sent as chat: ${S.line || (c && c.ex)}`; }
  else if (a === "copycmd") S.hint = "Copied the example.";
  else if (a === "opensp") S.hint = "Opens that debug window (the mockup stops here).";
  else if (a === "tolog") S.page = "log";
  else if (a === "role") { const i = ROLES.findIndex(r => r[0] === S.role); S.role = ROLES[(i + 1) % ROLES.length][0]; }
  render();
}
document.addEventListener("click", e => {
  const set = e.target.closest("[data-set]");
  if (set) { const [k, v] = set.dataset.set.split(":"); S[k] = v; if (k === "st") reset(); if (k === "role" && S.st === "cmdsSP") { S.st = "cmds"; S.sp = false; } render(); return; }
  if (e.target.closest("textarea, input")) { const i = e.target.closest("[data-in]"); typing = i ? i.dataset.in : null; return; }
  const aci = e.target.closest("[data-aci]"); if (aci) { S.acI = +aci.dataset.aci; acTake(); render(); return; }
  const pg = e.target.closest("[data-page]"); if (pg) { S.page = pg.dataset.page; S.focus = pg.dataset.f; typing = null; S.hint = null; render(); return; }
  const fd = e.target.closest("[data-fold]"); if (fd) { const k = fd.dataset.fold; S.fold[k] = !S.fold[k]; S.focus = fd.dataset.f; render(); return; }
  const cb = e.target.closest("[data-cb]"); if (cb) { const [k, ...rest] = cb.dataset.cb.split(":"); const key = rest.join(":");
    if (k === "k") S.kinds[key] = S.kinds[key] ? 0 : 1; else if (k === "m") S.mods[key] = modOn(key) ? 0 : 1; else S.files[key] = S.files[key] === 0 ? 1 : 0;
    S.focus = cb.dataset.f; render(); return; }
  const sn = e.target.closest("[data-snip]"); if (sn) { S.mode = "pad"; S.pad = SNIPS[+sn.dataset.snip][1]; typing = "pad"; S.focus = sn.dataset.f; render(); return; }
  const hs = e.target.closest("[data-hist]"); if (hs) { S.hi = +hs.dataset.hist; S.pad = HIST[S.hi]; typing = "pad"; render(); return; }
  const cm = e.target.closest("[data-cmd]"); if (cm) { S.csel = cm.dataset.cmd; const c = CMDS.find(x => x.cmd === S.csel); if (!S.sp) S.line = c.ex; S.focus = cm.dataset.f; S.hint = null; render(); return; }
  const a = e.target.closest("[data-act]"); if (a) { if (a.classList.contains("off")) return; if (a.dataset.f) S.focus = a.dataset.f; act(a.dataset.act, a); return; }
  const r = e.target.closest("[data-row]"); if (r) {
    const id = +r.dataset.row, en = LOG[id];
    if (e.target.closest(".tri") || (en && en.k === "error" && S.pick === id)) S.open[id] = !S.open[id];
    else if (en && en.k === "error" && !S.open[id]) S.open[id] = 1;
    S.pick = id; S.focus = "row-" + id; typing = null; S.ac = null; render();
  }
});
document.addEventListener("input", e => {
  const t = e.target.dataset.in; if (!t) return;
  const pos = e.target.selectionStart;
  if (t === "q") S.q = e.target.value; else if (t === "cq") S.cq = e.target.value;
  else if (t === "line") { S.line = e.target.value; if (S.page === "log") acFor("line", pos); }
  else if (t === "pad") { S.pad = e.target.value; acFor("pad", pos); }
  typing = t; caret = pos; S.hint = null; render();
});
document.addEventListener("keydown", e => {
  const t = e.target.dataset && e.target.dataset.in;
  if (t === "line" || t === "pad") {
    const el = e.target;
    if (S.ac && S.ac.which === t) {
      if (e.key === "ArrowDown") { e.preventDefault(); S.acI = Math.min(S.ac.items.length - 1, S.acI + 1); caret = el.selectionStart; render(); return; }
      if (e.key === "ArrowUp") { e.preventDefault(); S.acI = Math.max(0, S.acI - 1); caret = el.selectionStart; render(); return; }
      if (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey)) { e.preventDefault(); acTake(); render(); return; }
      if (e.key === "Escape") { e.preventDefault(); S.ac = null; caret = el.selectionStart; render(); return; }
    }
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (S.page === "cmds") act("send"); else act("run"); return; }
    if (e.key === "Tab") { e.preventDefault(); return; }
    const histStep = d => { if (!HIST.length) return; let i = S.hi == null ? HIST.length : S.hi; i = Math.max(0, Math.min(HIST.length, i + d));
      S.hi = i === HIST.length ? null : i; const v = S.hi == null ? "" : HIST[S.hi]; if (t === "line") S.line = v.split("\n").join(" "); else S.pad = v; typing = t; render(); };
    if (t === "line" && (e.key === "ArrowUp" || e.key === "ArrowDown") && S.page === "log") { e.preventDefault(); histStep(e.key === "ArrowUp" ? -1 : 1); return; }
    if (t === "pad" && e.key === "ArrowUp" && !el.value.slice(0, el.selectionStart).includes("\n")) { e.preventDefault(); histStep(-1); return; }
    if (t === "pad" && e.key === "ArrowDown" && !el.value.slice(el.selectionStart).includes("\n")) { e.preventDefault(); histStep(1); return; }
    return;
  }
  if (t) { if (e.key === "Escape") { if (t === "q") S.q = ""; else S.cq = ""; render(); } return; }
  if (S.input !== "pad") return;
  const list = focusables(); if (!list.length) return;
  let i = list.findIndex(el => el.dataset.f === S.focus);
  if (["ArrowDown", "ArrowRight"].includes(e.key)) i = Math.min(list.length - 1, i + 1);
  else if (["ArrowUp", "ArrowLeft"].includes(e.key)) i = Math.max(0, i - 1);
  else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); list[i].click(); return; }
  else return;
  e.preventDefault(); S.focus = list[i].dataset.f; render();
});
window.addEventListener("resize", fit);

/* ======================================================================
   Notes
   ====================================================================== */
function q(items) { return `<ol>${items.map(([qq, opts]) => `<li>${qq} ${opts.map((o, i) => (i ? " / " : "") + (i === 0 ? `<span class="rec">${o} (recommended)</span>` : o)).join("")}</li>`).join("")}</ol>`; }
function notes() {
  const per = {
    log: "Phase 1. The log page as it opens: everything in one list, newest at the foot, filters on the left. Untick a kind, a mod or a file; type in the search. Click an error to open its stack.",
    expand: "Phase 1. Prints switched off, Bandits' error picked and opened to its whole stack (the game's own lines, as 42.22 writes them). x37: the same error 37 times, folded into one row.",
    scratch: "Phase 2. The scratchpad open in place of the line, a snippet loaded. Type in it; Enter runs, Shift+Enter makes a new line, Up on the first line steps back through what you ran. Click a snippet or a history line to load it.",
    noload: "Phase 2. The build has no loadstring (as 42.20.4 had none). The box grays, a notice says why, Run grays; One line becomes the default keycap.",
    auto: "Phase 3. \"getP\" typed: the globals that start with it, from walking the game's environment. Keep typing, use Up/Down and Tab. Try \"ZeD.\", \"Events.\" or \"getGameTime():\" too.",
    java: "Phase 3. \"getPlayer():get\" typed: the Java methods of the player object, marked Java, shown only if Phase 0 finds a way to list them.",
    help: "Phase 3. The Help page: what runs where, the keys, the controller, the files. Each section folds.",
    cmds: "Phase 4. The command list for an Admin. Switch Role in the review bar: the list narrows to what that role can use. A click fills the chat line with the example; Send sends it (a command that can't be undone asks first).",
    cmdsSP: "Phase 4. Single player: every command shown with its debug-menu equivalent; commands with none are grayed. The default keycap opens the equivalent."
  };
  return `<h2>This state</h2><p>${per[S.st]}</p>
  <p>One window, three pages on its strip (Log, Commands, Help). The log page keeps today's console underneath: the game's console parked as the engine, its box, its history, its line. Debug mode only. Strings here are English drafts; every new one goes through the translation keys.</p>

  <h2>Phase 1, the log</h2>
  <h3>What's new</h3>
  <ul><li>The game's box and the F11 error list in one list. Each row: time, a status pixel and a word (print, warn, error, ran), the message, the mod and file:line, and a repeat count when an error comes back.</li>
  <li>Filters on the left under fold headers: KIND, MOD, FILE, each a checkbox with its count. The counts follow the search.</li>
  <li>Search looks at the message, mod, file and every stack line. The count reads "shown of total | errors".</li>
  <li>An error opens to its whole stack in place; it is still picked and copied whole. Its stack sits indented under the red pixel: today's thin red line down the trace goes (no side bars).</li>
  <li>Export writes what the filters show to Zomboid/Lua/ZeD_console_(date)_(time).log; the band says where.</li></ul>
  <h3>Open questions</h3>
  ${q([["A repeated error:", ["one row with a count (x37)", "every copy on its own row"]],
       ["Errors when the log opens:", ["closed to their first line", "open, whole stack showing"]],
       ["Export:", ["a new file each time, named for the time", "one file, written over each time"]]])}

  <h2>Phase 2, the scratchpad</h2>
  <h3>What's new</h3>
  <ul><li>The Scratchpad keycap swaps the one line for a box, past 256 characters, with line numbers. One line swaps back.</li>
  <li>Enter runs, Shift+Enter makes a new line. The run shows in the log as a "ran" row (the accent pixel) with its output under it; a compile error is an error row from Console.</li>
  <li>Beside the box: SNIPPETS and HISTORY. Both are kept on disk in Zomboid/Lua (.txt), so they last between games.</li>
  <li>No loadstring: a notice in the box, Run grayed, One line as the default.</li></ul>
  <h3>Open questions</h3>
  ${q([["Where the scratchpad opens:", ["in place of the line, under the log", "a column to the right of the log"]],
       ["Enter in the scratchpad:", ["runs it, Shift+Enter for a new line", "a new line, Ctrl+Enter runs"]],
       ["Naming a snippet:", ["Save snippet asks for a name in the band", "named from its first line, renamed later"]]])}

  <h2>Phase 3, discoverability</h2>
  <h3>What's new</h3>
  <ul><li>A ZeD pull-down above the caret as you type: globals after two letters, a table's fields after "." and a Java object's methods after ":". Each has a status pixel and a word (function, table, Java). Tab or Enter takes one; Up/Down moves; Esc closes. It replaces the game's single "Tab:" suggestion.</li>
  <li>Java methods only if the game allows it: Phase 0 checks for a helper that lists them. Without one, ":" shows nothing.</li>
  <li>The Help page: what runs where, the keys, the controller, the files.</li></ul>
  <h3>Open questions</h3>
  ${q([["The pull-down opens:", ["by itself after two letters", "only when you press Tab"]],
       ["Help:", ["a page on the strip", "the help band at the foot only"]]])}

  <h2>Phase 4, the command list</h2>
  <h3>What's new</h3>
  <ul><li>Every server slash command (the bundled list will have all 78 under 92 names; this mockup shows 52) in six groups. Each row: the command, what it does, and the access level as a status pixel and a word. Picked: syntax, example, the level and capability, and its single-player equivalent.</li>
  <li>Filtered to your role. A click fills the chat line with the example. Send sends it as chat does if Phase 0 finds that path; otherwise it fills the game's chat box.</li>
  <li>Single player: every command shows its debug-menu equivalent; those with none gray out.</li></ul>
  <h3>Open questions</h3>
  ${q([["Commands above your role:", ["hidden", "shown grayed, with the role they need"]],
       ["Commands that can't be undone (/removezombies, /grantadmin, /removeadmin, /changeoption):", ["Send asks first, in the band", "no extra step"]],
       ["Single player, picking a command:", ["opens its debug window", "only says where it is"]]])}

  <h2>Controller and the Deck</h2>
  <ul><li>The hand moves through the page strip, the filters, the search, the log, the line (or the scratchpad and its lists) and the band, in that order (arrow keys here when Input is Controller; Enter presses).</li>
  <li>A ticks a filter, opens or closes an error, types (ZeD's pad keyboard opens under the window), presses a button. B closes. X exports (on the log) or saves a snippet. Y swaps one line and the scratchpad. LB/RB step older and newer runs on the line, as today.</li>
  <li>With the pad keyboard open, the autocomplete shows as a row of keys over the keyboard: D-pad up reaches it, A takes one.</li>
  <li>Deck 1280 x 800 Auto: the window opens at nearly full screen (the root clamps to 0.75), and the filter column keeps its width.</li></ul>
  <h3>Open questions</h3>
  ${q([["Changing pages on a pad:", ["D-pad left to the page strip", "LT / RT step through the pages"]],
       ["The filter column at the Deck:", ["kept", "folded away behind a Filters keycap"]]])}`;
}
// a link can open a state: #st=expand&view=deck&input=pad&theme=light&role=gm
for (const [k, v] of new URLSearchParams(location.hash.slice(1))) if (["st", "view", "input", "theme", "role"].includes(k)) S[k] = v;
reset();
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
</script>
</body>
</html>
